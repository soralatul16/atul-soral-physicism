<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGCSE Subtopic · Atul Soral Physicism</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f4f2ff;--white:#ffffff;--text:#1a1730;--text2:#413b63;--text3:#6b6590;
  --ig:#6c4cff;--ig-d:#5238cc;--ig-light:#ede9ff;--ig-pale:rgba(108,76,255,0.04);
  --glass:rgba(255,255,255,0.65);--glass-strong:rgba(255,255,255,0.85);
  --core:#16a34a;--core-bg:#f0fdf4;--core-border:rgba(22,163,74,0.15);
  --ext:#ea580c;--ext-bg:linear-gradient(135deg,#fff7ed,#ffedd5);--ext-border:rgba(234,88,12,0.15);
  --gold:#d97706;--gold-bg:linear-gradient(135deg,#fffbeb,#fef3c7);--gold-border:rgba(217,119,6,0.15);
  --line:rgba(108,76,255,0.1);--r:16px;
}
[data-theme="dark"]{
  --bg:#141227;--white:#211d3d;--text:#e8e5f7;--text2:#a8a2c8;--text3:#7a739e;
  --ig:#8b6dff;--ig-d:#6c4cff;--ig-light:#2a2450;--ig-pale:rgba(139,109,255,0.08);
  --glass:rgba(20,18,39,0.85);--glass-strong:rgba(20,18,39,0.95);
  --core:#22c55e;--core-bg:#1a2e20;--core-border:rgba(34,197,94,0.2);
  --ext:#fb923c;--ext-bg:linear-gradient(135deg,#2e1f13,#3a2716);--ext-border:rgba(234,88,12,0.25);
  --gold:#f59e0b;--gold-bg:linear-gradient(135deg,#2a2617,#1f1c12);--gold-border:rgba(217,119,6,0.2);
  --line:rgba(139,109,255,0.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Palatino Linotype',Palatino,serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.sans{font-family:'Outfit',-apple-system,system-ui,sans-serif}

/* TOPBAR */
.topbar{height:56px;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100}
.tb-brand{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:7px}
.tb-dot{width:7px;height:7px;background:var(--ig);border-radius:50%;box-shadow:0 0 8px var(--ig)}
.tb-actions{display:flex;gap:8px;align-items:center}
.gl-btn{font-family:'Outfit',sans-serif;padding:6px 16px;border-radius:50px;font-size:11.5px;font-weight:600;color:var(--ig-d);text-decoration:none;background:linear-gradient(135deg,var(--ig-light),rgba(108,76,255,0.08));border:1px solid var(--line);cursor:pointer;transition:all .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,0.5)}
.gl-btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.6),0 3px 10px rgba(108,76,255,0.15)}

/* HERO */
.hero{background:linear-gradient(135deg,var(--ig),var(--ig-d));color:#fff;padding:34px 28px 30px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 70%);border-radius:50%}
.hero-wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}
.hero .badges{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hero .badges span{font-family:'Outfit',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:4px 12px;border-radius:50px;background:rgba(255,255,255,0.18);backdrop-filter:blur(6px)}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin-bottom:6px}
.hero .sub{font-family:'Outfit',sans-serif;font-size:13px;opacity:.9}

/* TABS */
.tabs{display:flex;gap:0;background:var(--glass-strong);backdrop-filter:blur(20px);border-bottom:2px solid var(--line);position:sticky;top:56px;z-index:90;padding:0 24px;overflow-x:auto}
.tab{font-family:'Outfit',sans-serif;padding:14px 20px;font-size:12.5px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--ig)}
.tab.active{color:var(--ig-d);border-bottom-color:var(--ig)}

.wrap{max-width:1000px;margin:0 auto;padding:26px 28px 90px}
.panel{display:none;animation:fade .3s ease}.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* CARDS / LAYERS */
.card{background:var(--white);border-radius:18px;padding:28px 30px;box-shadow:0 2px 16px rgba(80,56,204,0.06);margin-bottom:16px;border:1px solid var(--line)}
.big-idea{background:linear-gradient(135deg,var(--ig-light),rgba(108,76,255,0.05));border:1.5px solid var(--line);border-radius:18px;padding:24px 28px;margin-bottom:18px;position:relative}
.big-idea::before{content:'THE BIG IDEA';position:absolute;top:-9px;left:20px;background:linear-gradient(135deg,var(--ig),var(--ig-d));color:#fff;font-family:'Outfit',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:1.5px;padding:3px 12px;border-radius:5px}
.big-idea p{font-size:16px;color:var(--text2);margin-top:4px}

/* DECK */
.slide{display:none}.slide.active{display:block;min-height:300px;animation:fade .35s ease}
.slide h2{font-family:'Outfit',sans-serif;color:var(--ig-d);font-size:22px;margin-bottom:16px;letter-spacing:-0.01em}
.slide p{color:var(--text2);margin-bottom:12px}
.slide ul,.slide ol{padding-left:22px;margin-bottom:12px}.slide li{margin-bottom:8px;color:var(--text2)}
.slide strong{color:var(--text)}
.deck-nav{display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.deck-nav button{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,var(--ig),var(--ig-d));color:#fff;border:none;border-radius:50px;padding:10px 22px;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(108,76,255,0.25)}
.deck-nav button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,76,255,0.32)}
.deck-nav button:disabled{opacity:.35;cursor:default;box-shadow:none}
.dots{display:flex;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .2s}.dot.on{background:var(--ig);transform:scale(1.25)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--ig),var(--ig-d));border-radius:4px;transition:width .3s ease}
.f{opacity:0;transform:translateY(8px);transition:all .5s ease}.f.show{opacity:1;transform:none}

.ig-tbl{border-collapse:collapse;width:100%;margin:12px 0;font-family:'Outfit',sans-serif}
.ig-tbl th,.ig-tbl td{border:1px solid var(--line);padding:9px 12px;text-align:left;font-size:.9rem}
.ig-tbl th{background:var(--ig-light);color:var(--ig-d);font-weight:600}
.ig-ext{display:inline-block;background:var(--ext-bg);color:var(--ext);font-family:'Outfit',sans-serif;font-size:9px;font-weight:700;letter-spacing:.5px;padding:3px 10px;border-radius:50px;margin-bottom:10px;border:1px solid var(--ext-border)}
.ig-ext-h{color:var(--ext)}
.pq{background:var(--ig-pale);border-left:4px solid var(--ig);padding:16px 18px;border-radius:12px}

/* NOTES / REVISION */
.panel h3{font-family:'Outfit',sans-serif;color:var(--ig-d);font-size:20px;margin-bottom:8px;letter-spacing:-0.01em}
.panel h4{font-family:'Outfit',sans-serif;color:var(--ig-d);font-size:16px;margin:20px 0 8px}
.panel p{color:var(--text2);margin-bottom:12px}
.panel ul,.panel ol{padding-left:22px;margin-bottom:12px}.panel li{margin-bottom:8px;color:var(--text2)}
.panel strong{color:var(--text)}

/* PRACTICE */
.qc{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 2px 12px rgba(80,56,204,0.04)}
.qc .qh{display:flex;justify-content:space-between;align-items:center;font-family:'Outfit',sans-serif;font-weight:600;margin-bottom:10px}
.qmk{color:var(--ig-d);font-size:.78rem;background:var(--ig-light);padding:3px 10px;border-radius:50px}
.qc p{color:var(--text2);margin-bottom:12px}
.opt{font-family:'Outfit',sans-serif;display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--white);color:var(--text);border-radius:10px;padding:11px 14px;margin:6px 0;cursor:pointer;font-size:.9rem;transition:all .15s}
.opt:hover{border-color:var(--ig);transform:translateX(3px)}
.opt.correct{background:var(--core-bg);border-color:var(--core);color:var(--core)}
.opt.wrong{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.qc textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-family:'Outfit',sans-serif;background:var(--white);color:var(--text);font-size:.9rem;resize:vertical}
.sol{display:none;margin-top:12px;background:var(--ig-pale);border-left:3px solid var(--ig);border-radius:10px;padding:14px;font-size:.9rem;color:var(--text2)}
.sol.show{display:block;animation:fade .25s}
.showsol{font-family:'Outfit',sans-serif;background:none;border:none;color:var(--ig-d);font-weight:600;cursor:pointer;font-size:.82rem;padding:6px 0;margin-top:6px}
.empty{text-align:center;color:var(--text3);padding:50px;font-family:'Outfit',sans-serif}
.empty .big{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>
<div class="topbar">
  <a href="igcse-dashboard.html" class="tb-brand"><span class="tb-dot"></span>Atul Soral Physicism</a>
  <div class="tb-actions">
    <a href="igcse-dashboard.html" class="gl-btn">← Dashboard</a>
    <button class="gl-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
  </div>
</div>

<div class="hero"><div class="hero-wrap">
  <div class="badges" id="heroBadges"></div>
  <h1 id="subTitle">Loading…</h1>
  <div class="sub">Cambridge IGCSE Physics · 0625 · Exams 2026–2028</div>
</div></div>

<div class="tabs">
  <button class="tab active" onclick="showTab('pres',this)">📊 Presentation</button>
  <button class="tab" onclick="showTab('notes',this)">📖 Notes</button>
  <button class="tab" onclick="showTab('prac',this)">✍️ Practice</button>
  <button class="tab" onclick="showTab('rev',this)">⚡ Revision</button>
</div>

<div class="wrap">
  <div id="pres" class="panel active">
    <div class="card">
      <div class="prog"><div class="prog-fill" id="progFill"></div></div>
      <div id="deck"></div>
      <div class="deck-nav">
        <button id="prev" onclick="step(-1)">‹ Back</button>
        <div class="dots" id="dots"></div>
        <button id="next" onclick="step(1)">Next ›</button>
      </div>
    </div>
  </div>
  <div id="notes" class="panel"><div class="card" id="notesBox"></div></div>
  <div id="prac" class="panel"><div id="pracBox"></div></div>
  <div id="rev" class="panel"><div class="card" id="revBox"></div></div>
</div>

<script src="igcse-content.js"></script>
<script>
// theme
(function(){ var t=localStorage.getItem('ig_theme'); if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');} })();
function toggleTheme(){
  var d=document.documentElement.getAttribute('data-theme')==='dark';
  if(d){document.documentElement.removeAttribute('data-theme');localStorage.setItem('ig_theme','light');document.getElementById('themeBtn').textContent='🌙 Dark';}
  else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('ig_theme','dark');document.getElementById('themeBtn').textContent='☀️ Light';}
}
document.addEventListener('DOMContentLoaded',function(){ if(document.documentElement.getAttribute('data-theme')==='dark'){document.getElementById('themeBtn').textContent='☀️ Light';} });

var code=new URLSearchParams(location.search).get('code')||'IG1.1';
var C=(window.IGCSE_CONTENT||{})[code];
var di=0, slides=[];

function tierBadge(t){ return t==='core'?'<span style="background:rgba(34,197,94,.25)">Core</span>':t==='ext'?'<span style="background:rgba(234,88,12,.3)">Extended</span>':'<span>Core + Extended</span>'; }

if(!C){
  document.getElementById('subTitle').textContent=code.replace('IG','')+' — coming soon';
  document.getElementById('heroBadges').innerHTML='<span>'+code+'</span>';
  ['deck','notesBox','pracBox','revBox'].forEach(function(id){
    document.getElementById(id).innerHTML='<div class="empty"><div class="big">🚧</div>Content for '+code+' is being prepared and will appear here soon.</div>';
  });
  document.querySelector('.deck-nav').style.display='none';
  document.querySelector('.prog').style.display='none';
}else{
  document.getElementById('subTitle').textContent=code.replace('IG','')+' '+C.title;
  document.getElementById('heroBadges').innerHTML='<span>'+code+'</span>'+tierBadge(C.tier);
  slides=C.slides||[];
  renderDeck(); renderDots();
  document.getElementById('notesBox').innerHTML=C.notes||emptyMsg('Notes');
  document.getElementById('revBox').innerHTML=C.revision||emptyMsg('Revision');
  renderPractice();
}
function emptyMsg(w){ return '<div class="empty"><div class="big">📝</div>'+w+' coming soon.</div>'; }

function renderDeck(){
  document.getElementById('deck').innerHTML=slides.map(function(s,i){
    return '<div class="slide'+(i===0?' active':'')+'"><h2>'+s.title+'</h2>'+s.html+'</div>';
  }).join('');
  updateDeck();
}
function renderDots(){ document.getElementById('dots').innerHTML=slides.map(function(_,i){return '<span class="dot'+(i===0?' on':'')+'"></span>';}).join(''); }
function step(d){ di=Math.max(0,Math.min(slides.length-1,di+d)); updateDeck(); }
function updateDeck(){
  document.querySelectorAll('.slide').forEach(function(s,i){ s.classList.toggle('active',i===di); });
  document.querySelectorAll('.dot').forEach(function(dt,i){ dt.classList.toggle('on',i===di); });
  document.getElementById('prev').disabled=di===0;
  document.getElementById('next').disabled=di===slides.length-1;
  document.getElementById('progFill').style.width=((di+1)/slides.length*100)+'%';
  var act=document.querySelectorAll('.slide')[di];
  if(act) act.querySelectorAll('.f').forEach(function(f,k){ setTimeout(function(){ f.classList.add('show'); },120+k*120); });
  doMath();
}
function renderPractice(){
  var box=document.getElementById('pracBox'); var qs=C.practice||[];
  if(!qs.length){ box.innerHTML='<div class="card">'+emptyMsg('Practice questions')+'</div>'; return; }
  box.innerHTML=qs.map(function(q,i){
    var body = q.type==='mcq'
      ? q.options.map(function(o,oi){ return '<button class="opt" onclick="pick(this,'+i+','+oi+')">'+String.fromCharCode(65+oi)+'. '+o+'</button>'; }).join('')
      : '<textarea placeholder="Write your answer, then reveal the mark scheme…"></textarea>';
    return '<div class="qc"><div class="qh"><span>Question '+(i+1)+'</span><span class="qmk">'+q.marks+' mark'+(q.marks>1?'s':'')+'</span></div>'+
      '<p>'+q.q+'</p>'+body+
      '<button class="showsol" onclick="toggleSol('+i+')">Show mark scheme ▾</button>'+
      '<div class="sol" id="sol'+i+'"><strong>Mark scheme:</strong> '+q.solution+'</div></div>';
  }).join('');
}
function pick(btn,qi,oi){
  var q=C.practice[qi], parent=btn.parentNode;
  parent.querySelectorAll('.opt').forEach(function(b){ b.classList.remove('correct','wrong'); });
  if(oi===q.answer) btn.classList.add('correct');
  else{ btn.classList.add('wrong'); parent.querySelectorAll('.opt')[q.answer].classList.add('correct'); }
}
function toggleSol(i){ document.getElementById('sol'+i).classList.toggle('show'); }
function showTab(id,btn){
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById(id==='pres'?'pres':id==='notes'?'notes':id==='prac'?'prac':'rev').classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); }); btn.classList.add('active');
  doMath();
}
function doMath(){ if(window.renderMathInElement) try{ renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}]}); }catch(e){} }
</script>
</body>
</html>
