<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGCSE Subtopic · Atul Soral Physicism</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f4f2ff;--white:#fff;--text:#1a1730;--text2:#413b63;--text3:#6b6590;
  --ig:#6c4cff;--ig-d:#5238cc;--ig-light:#ede9ff;--ig-pale:rgba(108,76,255,0.04);
  --glass:rgba(255,255,255,0.85);--line:rgba(108,76,255,0.1);
  --found:#d97706;--found-bg:linear-gradient(135deg,#fffbeb,#fef3c7);--found-b:rgba(217,119,6,0.2);
  --core:#16a34a;--core-bg:#f0fdf4;--core-b:rgba(22,163,74,0.18);
  --ext:#0ea5e9;--ext-bg:linear-gradient(135deg,#f0f9ff,#e0f2fe);--ext-b:rgba(14,165,233,0.2);
}
[data-theme="dark"]{
  --bg:#141227;--white:#211d3d;--text:#e8e5f7;--text2:#a8a2c8;--text3:#7a739e;
  --ig:#8b6dff;--ig-d:#6c4cff;--ig-light:#2a2450;--ig-pale:rgba(139,109,255,0.08);
  --glass:rgba(20,18,39,0.9);--line:rgba(139,109,255,0.15);
  --found:#f59e0b;--found-bg:linear-gradient(135deg,#2a2617,#1f1c12);--found-b:rgba(217,119,6,0.3);
  --core:#22c55e;--core-bg:#1a2e20;--core-b:rgba(34,197,94,0.25);
  --ext:#38bdf8;--ext-bg:linear-gradient(135deg,#0c2537,#0e3346);--ext-b:rgba(14,165,233,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,Palatino,serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.sans{font-family:'Outfit',sans-serif}
.topbar{height:56px;background:var(--glass);backdrop-filter:blur(24px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100}
.tb-brand{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:7px}
.tb-dot{width:7px;height:7px;background:var(--ig);border-radius:50%;box-shadow:0 0 8px var(--ig)}
.tb-actions{display:flex;gap:8px;align-items:center}
.gl-btn{font-family:'Outfit',sans-serif;padding:6px 15px;border-radius:50px;font-size:11.5px;font-weight:600;color:var(--ig-d);text-decoration:none;background:var(--ig-light);border:1px solid var(--line);cursor:pointer;transition:.2s}
.gl-btn:hover{transform:translateY(-1px)}
.hero{background:linear-gradient(135deg,var(--ig),var(--ig-d));color:#fff;padding:32px 28px 28px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 70%);border-radius:50%}
.hero-wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}
.hero .badges{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hero .badges span{font-family:'Outfit',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:4px 12px;border-radius:50px;background:rgba(255,255,255,0.18)}
.hero h1{font-size:29px;font-weight:700;line-height:1.2;margin-bottom:6px}
.hero .sub{font-family:'Outfit',sans-serif;font-size:12.5px;opacity:.9}
.hero-prog{margin-top:14px;max-width:260px}
.hero-prog .lbl{font-family:'Outfit',sans-serif;font-size:11px;opacity:.85;display:flex;justify-content:space-between;margin-bottom:4px}
.hero-prog .bar{height:5px;background:rgba(255,255,255,0.2);border-radius:5px;overflow:hidden}
.hero-prog .fill{height:100%;width:0;background:#fff;border-radius:5px;transition:width .3s}
.tabs{display:flex;background:var(--glass);backdrop-filter:blur(20px);border-bottom:2px solid var(--line);position:sticky;top:56px;z-index:90;padding:0 24px;overflow-x:auto}
.tab{font-family:'Outfit',sans-serif;padding:14px 18px;font-size:12.5px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--ig)}.tab.active{color:var(--ig-d);border-bottom-color:var(--ig)}
.wrap{max-width:1000px;margin:0 auto;padding:24px 28px 90px}
.panel{display:none;animation:fade .3s}.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--white);border-radius:18px;padding:26px 30px;box-shadow:0 2px 16px rgba(80,56,204,0.06);margin-bottom:16px;border:1px solid var(--line)}
/* layered learn boxes */
.layer{border-radius:16px;margin-bottom:16px;overflow:hidden;border:1.5px solid}
.layer-h{padding:14px 22px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px}
.layer-b{padding:22px 26px}
.layer.collapsed .layer-b{display:none}
.layer .caret{transition:transform .2s;opacity:.5}.layer.collapsed .caret{transform:rotate(-90deg)}
.l-found{border-color:var(--found-b)}.l-found .layer-h{background:var(--found-bg);color:var(--found)}.l-found .layer-b{background:var(--white)}
.l-core{border-color:var(--core-b)}.l-core .layer-h{background:var(--core-bg);color:var(--core)}.l-core .layer-b{background:var(--white)}
.l-ext{border-color:var(--ext-b)}.l-ext .layer-h{background:var(--ext-bg);color:var(--ext)}.l-ext .layer-b{background:var(--white)}
.l-badge{font-family:'Outfit',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:5px;color:#fff;margin-right:10px}
.lb-found{background:linear-gradient(135deg,#f59e0b,#d97706)}.lb-core{background:linear-gradient(135deg,#16a34a,#15803d)}.lb-ext{background:linear-gradient(135deg,#0ea5e9,#0284c7)}
.layer-b h4{font-family:'Outfit',sans-serif;color:var(--text);font-size:15px;margin:16px 0 6px}.layer-b h4:first-child{margin-top:0}
.layer-b p{color:var(--text2);margin-bottom:12px}.layer-b ul{padding-left:22px;margin-bottom:12px}.layer-b li{margin-bottom:7px;color:var(--text2)}
.layer-b strong{color:var(--text)}
.ig-tbl{border-collapse:collapse;width:100%;margin:10px 0;font-family:'Outfit',sans-serif}
.ig-tbl th,.ig-tbl td{border:1px solid var(--line);padding:8px 11px;text-align:left;font-size:.88rem}
.ig-tbl th{background:var(--ig-light);color:var(--ig-d)}
/* simulate */
.sim{background:var(--white);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.sim-h{padding:16px 22px;border-bottom:1px solid var(--line)}
.sim-t{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700}.sim-s{font-family:'Outfit',sans-serif;font-size:11.5px;color:var(--text3);margin-top:2px}
.sim-b{padding:22px}
.sim-frame{width:100%;height:460px;border:1px solid var(--line);border-radius:12px;background:#fff}
.sim-link{font-family:'Outfit',sans-serif;display:inline-block;margin-top:14px;padding:10px 24px;background:linear-gradient(135deg,var(--ig),var(--ig-d));color:#fff;border-radius:50px;text-decoration:none;font-size:13px;font-weight:600}
.sim-ins{margin-top:16px}.sim-ins p{color:var(--text2);margin-bottom:6px}
/* formulas */
.eq{background:var(--ig-pale);border:1.5px solid var(--line);border-left:4px solid var(--ig);border-radius:14px;padding:18px 22px;margin-bottom:12px}
.eq-f{font-family:'Cambria Math',Georgia,serif;font-size:20px;color:var(--ig-d);margin-bottom:4px}
.eq-d{font-family:'Outfit',sans-serif;font-size:12.5px;color:var(--text3)}
/* practice / exam */
.qc{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 2px 12px rgba(80,56,204,0.04)}
.qc .qh{display:flex;justify-content:space-between;align-items:center;font-family:'Outfit',sans-serif;font-weight:600;margin-bottom:10px}
.qmk{color:var(--ig-d);font-size:.78rem;background:var(--ig-light);padding:3px 10px;border-radius:50px}
.qc p{color:var(--text2);margin-bottom:12px}
.opt{font-family:'Outfit',sans-serif;display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--white);color:var(--text);border-radius:10px;padding:11px 14px;margin:6px 0;cursor:pointer;font-size:.9rem;transition:.15s}
.opt:hover{border-color:var(--ig);transform:translateX(3px)}
.opt.correct{background:var(--core-bg);border-color:var(--core);color:var(--core)}.opt.wrong{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.qc textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-family:'Outfit',sans-serif;background:var(--white);color:var(--text);resize:vertical}
.sol{display:none;margin-top:12px;background:var(--ig-pale);border-left:3px solid var(--ig);border-radius:10px;padding:14px;font-size:.9rem;color:var(--text2)}.sol.show{display:block}
.showsol{font-family:'Outfit',sans-serif;background:none;border:none;color:var(--ig-d);font-weight:600;cursor:pointer;font-size:.82rem;padding:6px 0;margin-top:6px}
/* mistakes */
.mist{background:#fef2f2;border:1px solid #fecaca;border-left:4px solid #dc2626;border-radius:12px;padding:14px 18px;margin-bottom:10px;color:var(--text2)}
[data-theme="dark"] .mist{background:#2e1616;border-color:#5c2626}
.mist strong{color:var(--text)}
/* checklist */
.chk-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-family:'Outfit',sans-serif;cursor:pointer}
.chk-item input{width:20px;height:20px;margin-top:2px;accent-color:var(--ig);cursor:pointer;flex-shrink:0}
.chk-item.done span{color:var(--text3);text-decoration:line-through}
.chk-done-banner{background:var(--core-bg);border:1.5px solid var(--core-b);color:var(--core);border-radius:12px;padding:16px;text-align:center;font-family:'Outfit',sans-serif;font-weight:600;margin-top:16px;display:none}
.chk-done-banner.show{display:block}
.empty{text-align:center;color:var(--text3);padding:50px;font-family:'Outfit',sans-serif}.empty .big{font-size:40px;margin-bottom:10px}
/* deck */
.slide{display:none}.slide.active{display:block;min-height:300px;animation:fade .35s}
.slide h2{font-family:'Outfit',sans-serif;color:var(--ig-d);font-size:22px;margin-bottom:16px}
.slide p{color:var(--text2);margin-bottom:12px}.slide ul{padding-left:22px;margin-bottom:12px}.slide li{margin-bottom:8px;color:var(--text2)}
.slide strong{color:var(--text)}
.deck-dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.2s}.deck-dot.on{background:var(--ig);transform:scale(1.25)}
.f{opacity:0;transform:translateY(8px);transition:all .5s}.f.show{opacity:1;transform:none}
.pq{background:var(--ig-pale);border-left:4px solid var(--ig);padding:16px 18px;border-radius:12px}
.ig-ext{display:inline-block;background:var(--ext-bg);color:var(--ext);font-family:'Outfit',sans-serif;font-size:9px;font-weight:700;padding:3px 10px;border-radius:50px;margin-bottom:10px;border:1px solid var(--ext-b)}
</style>
</head>
<body>
<div class="topbar">
  <a href="igcse-dashboard.html" class="tb-brand"><span class="tb-dot"></span>Atul Soral Physicism</a>
  <div class="tb-actions">
    <a href="igcse-dashboard.html" class="gl-btn">← Dashboard</a>
    <button class="gl-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
  </div>
</div>
<div class="hero"><div class="hero-wrap">
  <div class="badges" id="heroBadges"></div>
  <h1 id="subTitle">Loading…</h1>
  <div class="sub">Cambridge IGCSE Physics · 0625 · Exams 2026–2028</div>
  <div class="hero-prog"><div class="lbl"><span>Your progress</span><span id="progTxt">0/0</span></div><div class="bar"><div class="fill" id="progFill"></div></div></div>
</div></div>
<div class="tabs">
  <button class="tab active" onclick="showTab('pres',this)">📊 Presentation</button>
  <button class="tab" onclick="showTab('learn',this)">📖 Learn</button>
  <button class="tab" onclick="showTab('sim',this)">🔬 Simulate</button>
  <button class="tab" onclick="showTab('form',this)">📐 Formulas</button>
  <button class="tab" onclick="showTab('prac',this)">✍️ Practice</button>
  <button class="tab" onclick="showTab('mist',this)">⚠️ Mistakes</button>
  <button class="tab" onclick="showTab('exam',this)">🎯 Exam</button>
  <button class="tab" onclick="showTab('chk',this)">✅ Checklist</button>
</div>
<div class="wrap">
  <div id="pres" class="panel active">
    <div class="card">
      <div style="height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px"><div id="deckProg" style="height:100%;width:0;background:linear-gradient(90deg,var(--ig),var(--ig-d));border-radius:4px;transition:width .3s"></div></div>
      <div id="deck"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)">
        <button id="deckPrev" class="gl-btn" style="padding:10px 20px;font-size:13px" onclick="deckStep(-1)">‹ Back</button>
        <div id="deckDots" style="display:flex;gap:7px"></div>
        <button id="deckNext" class="gl-btn" style="padding:10px 20px;font-size:13px" onclick="deckStep(1)">Next ›</button>
      </div>
    </div>
  </div>
  <div id="learn" class="panel"></div>
  <div id="sim" class="panel"></div>
  <div id="form" class="panel"></div>
  <div id="prac" class="panel"></div>
  <div id="mist" class="panel"></div>
  <div id="exam" class="panel"></div>
  <div id="chk" class="panel"></div>
</div>

<script src="igcse-content.js"></script>
<script>
(function(){ if(localStorage.getItem('ig_theme')==='dark') document.documentElement.setAttribute('data-theme','dark'); })();
function toggleTheme(){
  var d=document.documentElement.getAttribute('data-theme')==='dark';
  if(d){document.documentElement.removeAttribute('data-theme');localStorage.setItem('ig_theme','light');document.getElementById('themeBtn').textContent='🌙 Dark';}
  else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('ig_theme','dark');document.getElementById('themeBtn').textContent='☀️ Light';}
}
document.addEventListener('DOMContentLoaded',function(){ if(document.documentElement.getAttribute('data-theme')==='dark')document.getElementById('themeBtn').textContent='☀️ Light'; });

var code=new URLSearchParams(location.search).get('code')||'IG1.1';
var C=(window.IGCSE_CONTENT||{})[code];
var CKEY='ig_chk_'+code;

function tierBadge(t){ return t==='core'?'<span style="background:rgba(34,197,94,.3)">Core</span>':t==='ext'?'<span style="background:rgba(14,165,233,.35)">Extended</span>':'<span>Core + Extended</span>'; }
function empty(w){ return '<div class="empty"><div class="big">📝</div>'+w+' coming soon.</div>'; }

if(!C){
  document.getElementById('subTitle').textContent=code.replace('IG','')+' — coming soon';
  document.getElementById('heroBadges').innerHTML='<span>'+code+'</span>';
  ['learn','sim','form','prac','mist','exam','chk'].forEach(function(id){ document.getElementById(id).innerHTML='<div class="card"><div class="empty"><div class="big">🚧</div>Content for '+code+' is being prepared.</div></div>'; });
  document.getElementById('deck').innerHTML='<div class="empty"><div class="big">🚧</div>Presentation coming soon.</div>';
  document.querySelector('#pres .card > div:last-child').style.display='none';
  document.querySelector('.hero-prog').style.display='none';
}else{
  document.getElementById('subTitle').textContent=code.replace('IG','')+' '+C.title;
  document.getElementById('heroBadges').innerHTML='<span>'+code+'</span>'+tierBadge(C.tier);
  renderDeck(); renderLearn(); renderSim(); renderForm(); renderPrac(); renderMist(); renderExam(); renderChk();
}

var di=0, slides=[];
function renderDeck(){
  slides=C.slides||[];
  if(!slides.length){ document.getElementById('deck').innerHTML='<div class="empty"><div class="big">📊</div>Presentation coming soon.</div>'; document.querySelector('#pres .card > div:last-child').style.display='none'; return; }
  document.getElementById('deck').innerHTML=slides.map(function(s,i){ return '<div class="slide'+(i===0?' active':'')+'"><h2>'+s.title+'</h2>'+s.html+'</div>'; }).join('');
  document.getElementById('deckDots').innerHTML=slides.map(function(_,i){return '<span class="deck-dot'+(i===0?' on':'')+'"></span>';}).join('');
  updateDeck();
}
function deckStep(d){ di=Math.max(0,Math.min(slides.length-1,di+d)); updateDeck(); }
function updateDeck(){
  document.querySelectorAll('.slide').forEach(function(s,i){ s.classList.toggle('active',i===di); });
  document.querySelectorAll('.deck-dot').forEach(function(dt,i){ dt.classList.toggle('on',i===di); });
  document.getElementById('deckPrev').style.visibility=di===0?'hidden':'visible';
  document.getElementById('deckNext').style.visibility=di===slides.length-1?'hidden':'visible';
  document.getElementById('deckProg').style.width=((di+1)/slides.length*100)+'%';
  var act=document.querySelectorAll('.slide')[di];
  if(act) act.querySelectorAll('.f').forEach(function(f,k){ setTimeout(function(){ f.classList.add('show'); },120+k*120); });
  doMath();
}

function renderLearn(){
  var L=C.learn||[];
  document.getElementById('learn').innerHTML = L.length? L.map(function(s){
    var cls=s.tier==='foundation'?'l-found':s.tier==='ext'?'l-ext':'l-core';
    var bd=s.tier==='foundation'?'<span class="l-badge lb-found">FOUNDATION</span>':s.tier==='ext'?'<span class="l-badge lb-ext">EXTENDED</span>':'<span class="l-badge lb-core">CORE</span>';
    return '<div class="layer '+cls+'"><div class="layer-h" onclick="this.parentNode.classList.toggle(\'collapsed\')"><span>'+bd+s.heading+'</span><span class="caret">▾</span></div><div class="layer-b">'+s.html+'</div></div>';
  }).join('') : '<div class="card">'+empty('Lesson')+'</div>';
  doMath();
}
function renderSim(){
  var s=C.simulation;
  if(!s){ document.getElementById('sim').innerHTML='<div class="card">'+empty('Simulation')+'</div>'; return; }
  document.getElementById('sim').innerHTML='<div class="sim"><div class="sim-h"><div class="sim-t">🔬 '+s.title+'</div><div class="sim-s">'+(s.source||'Interactive Simulation')+'</div></div>'+
    '<div class="sim-b"><iframe class="sim-frame" src="'+s.file+'" loading="lazy"></iframe>'+
    '<a class="sim-link" href="'+s.file+'" target="_blank">Open full screen →</a>'+
    (s.instructions&&s.instructions.length?'<div class="sim-ins"><h4 class="sans" style="color:var(--ig-d);margin-bottom:8px">Try this:</h4>'+s.instructions.map(function(t,i){return '<p>'+(i+1)+'. '+t+'</p>';}).join('')+'</div>':'')+
    '</div></div>';
}
function renderForm(){
  var F=C.formulas||[];
  document.getElementById('form').innerHTML = F.length? '<div class="card">'+F.map(function(x){return '<div class="eq"><div class="eq-f">'+x.f+'</div><div class="eq-d">'+x.d+'</div></div>';}).join('')+'</div>' : '<div class="card">'+empty('Formulas')+'</div>';
  doMath();
}
function renderPrac(){
  var qs=C.practice||[];
  document.getElementById('prac').innerHTML = qs.length? qs.map(function(q,i){
    var body=q.type==='mcq'? q.options.map(function(o,oi){return '<button class="opt" onclick="pick(this,'+i+','+oi+')">'+String.fromCharCode(65+oi)+'. '+o+'</button>';}).join('') : '<textarea placeholder="Write your answer…"></textarea>';
    return '<div class="qc"><div class="qh"><span>Question '+(i+1)+'</span><span class="qmk">'+q.marks+' mark'+(q.marks>1?'s':'')+'</span></div><p>'+q.q+'</p>'+body+'<button class="showsol" onclick="toggleSol(\'p\','+i+')">Show mark scheme ▾</button><div class="sol" id="solp'+i+'"><strong>Mark scheme:</strong> '+q.solution+'</div></div>';
  }).join('') : '<div class="card">'+empty('Practice')+'</div>';
}
function renderMist(){
  var M=C.mistakes||[];
  document.getElementById('mist').innerHTML = M.length? '<div class="card"><h3 class="sans" style="color:var(--ig-d);margin-bottom:14px">⚠️ Common mistakes to avoid</h3>'+M.map(function(m){return '<div class="mist">'+m+'</div>';}).join('')+'</div>' : '<div class="card">'+empty('Mistakes')+'</div>';
}
function renderExam(){
  var E=C.exam||[];
  document.getElementById('exam').innerHTML = E.length? E.map(function(q,i){
    return '<div class="qc"><div class="qh"><span>Exam Q'+(i+1)+'</span><span class="qmk">'+q.marks+' mark'+(q.marks>1?'s':'')+'</span></div><p>'+q.q+'</p><textarea placeholder="Answer in exam style…"></textarea><button class="showsol" onclick="toggleSol(\'e\','+i+')">Show mark scheme ▾</button><div class="sol" id="sole'+i+'"><strong>Mark scheme:</strong> '+q.solution+'</div></div>';
  }).join('') : '<div class="card">'+empty('Exam questions')+'</div>';
}
function renderChk(){
  var items=C.checklist||[];
  if(!items.length){ document.getElementById('chk').innerHTML='<div class="card">'+empty('Checklist')+'</div>'; return; }
  var saved=JSON.parse(localStorage.getItem(CKEY)||'{}');
  document.getElementById('chk').innerHTML='<div class="card"><h3 class="sans" style="color:var(--ig-d);margin-bottom:6px">✅ Mark your understanding</h3>'+
    '<p style="color:var(--text3);font-size:.85rem;margin-bottom:10px">Tick each statement once you can do it. Your progress is saved on this device.</p>'+
    items.map(function(it,i){ var d=saved[i]?' done':''; return '<label class="chk-item'+d+'"><input type="checkbox" '+(saved[i]?'checked':'')+' onchange="tickChk('+i+',this.checked)"><span>'+it+'</span></label>'; }).join('')+
    '<div class="chk-done-banner" id="chkBanner">🎉 Subtopic complete — well done!</div></div>';
  updateProg();
}
function tickChk(i,val){
  var saved=JSON.parse(localStorage.getItem(CKEY)||'{}'); saved[i]=val; localStorage.setItem(CKEY,JSON.stringify(saved));
  var lbl=document.querySelectorAll('.chk-item')[i]; if(lbl) lbl.classList.toggle('done',val);
  updateProg();
}
function updateProg(){
  var items=C.checklist||[]; if(!items.length) return;
  var saved=JSON.parse(localStorage.getItem(CKEY)||'{}');
  var done=0; for(var i=0;i<items.length;i++) if(saved[i]) done++;
  document.getElementById('progTxt').textContent=done+'/'+items.length;
  document.getElementById('progFill').style.width=(done/items.length*100)+'%';
  var b=document.getElementById('chkBanner'); if(b) b.classList.toggle('show',done===items.length);
}
function pick(btn,qi,oi){ var q=C.practice[qi],p=btn.parentNode; p.querySelectorAll('.opt').forEach(function(b){b.classList.remove('correct','wrong');}); if(oi===q.answer)btn.classList.add('correct'); else{btn.classList.add('wrong');p.querySelectorAll('.opt')[q.answer].classList.add('correct');} }
function toggleSol(t,i){ document.getElementById('sol'+t+i).classList.toggle('show'); }
function showTab(id,btn){ document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');}); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');}); btn.classList.add('active'); doMath(); }
function doMath(){ if(window.renderMathInElement) try{ renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}]}); }catch(e){} }
</script>
</body>
</html>
