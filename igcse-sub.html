<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGCSE Subtopic · Atul Soral Physicism</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{--ig:#6c4cff;--ig-d:#5238cc;--bg:#f5f4ff;--card:#fff;--ink:#1e1b34;--ink2:#5b567a;--line:#e6e3f5;--core:#16a34a;--ext:#ea580c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
.top{background:linear-gradient(135deg,var(--ig),var(--ig-d));color:#fff;padding:16px 22px}
.top a{color:#fff;text-decoration:none;font-size:.82rem;opacity:.9}
.top h1{margin:6px 0 2px;font-size:1.25rem}
.top .meta{font-size:.82rem;opacity:.85}
.badge{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.b-core{background:#dcfce7;color:var(--core)} .b-ext{background:#ffedd5;color:var(--ext)} .b-both{background:#ede9fe;color:var(--ig-d)}
.tabs{display:flex;gap:4px;background:#fff;padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:8px;border:none;background:#f1eefe;color:var(--ink2);font-weight:600;font-size:.86rem;cursor:pointer}
.tab.active{background:var(--ig);color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:22px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border-radius:14px;padding:26px;box-shadow:0 1px 3px rgba(80,60,200,.08);margin-bottom:16px}
/* deck */
.slide{display:none}.slide.active{display:block;min-height:320px}
.slide h2{color:var(--ig-d);margin:0 0 14px}
.deck-nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.deck-nav button{background:var(--ig);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer}
.deck-nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.on{background:var(--ig)}
.f{opacity:.35;transition:.4s}.f.show{opacity:1}
.ig-tbl{border-collapse:collapse;width:100%;margin:10px 0}
.ig-tbl th,.ig-tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;font-size:.9rem}
.ig-tbl th{background:#f1eefe;color:var(--ig-d)}
.ig-ext{display:inline-block;background:#ffedd5;color:var(--ext);font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:8px}
.ig-ext-h{color:var(--ext)}
.pq{background:#f8f7ff;border-left:4px solid var(--ig);padding:14px 16px;border-radius:8px}
/* notes/revision */
.panel h3{color:var(--ig-d)} .panel h4{color:var(--ig-d);margin:16px 0 6px}
/* practice */
.qc{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.qc .qh{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.qmk{color:var(--ig-d);font-size:.8rem}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:5px 0;cursor:pointer;font-size:.9rem}
.opt:hover{border-color:var(--ig)}
.opt.correct{background:#dcfce7;border-color:var(--core)} .opt.wrong{background:#fee2e2;border-color:#dc2626}
.sol{display:none;margin-top:10px;background:#f8f7ff;border-radius:8px;padding:12px;font-size:.88rem}
.sol.show{display:block}
.showsol{background:none;border:none;color:var(--ig-d);font-weight:600;cursor:pointer;font-size:.82rem;padding:4px 0}
.empty{text-align:center;color:var(--ink2);padding:40px}
</style>
</head>
<body>
<div class="top">
  <a href="igcse-dashboard.html">← IGCSE Dashboard</a>
  <h1 id="subTitle">Loading…</h1>
  <div class="meta" id="subMeta"></div>
</div>
<div class="tabs">
  <button class="tab active" onclick="showTab('pres',this)">📊 Presentation</button>
  <button class="tab" onclick="showTab('notes',this)">📖 Notes</button>
  <button class="tab" onclick="showTab('prac',this)">✍️ Practice</button>
  <button class="tab" onclick="showTab('rev',this)">⚡ Revision</button>
</div>
<div class="wrap">
  <div id="pres" class="panel active"><div class="card"><div id="deck"></div>
    <div class="deck-nav"><button id="prev" onclick="step(-1)">‹ Back</button>
      <div class="dots" id="dots"></div>
      <button id="next" onclick="step(1)">Next ›</button></div></div></div>
  <div id="notes" class="panel"><div class="card" id="notesBox"></div></div>
  <div id="prac" class="panel"><div id="pracBox"></div></div>
  <div id="rev" class="panel"><div class="card" id="revBox"></div></div>
</div>

<script src="igcse-content.js"></script>
<script>
var code=new URLSearchParams(location.search).get('code')||'IG1.1';
var C=(window.IGCSE_CONTENT||{})[code];
var di=0, slides=[];

function badge(t){ return t==='core'?'<span class="badge b-core">Core</span>':t==='ext'?'<span class="badge b-ext">Extended</span>':'<span class="badge b-both">Core + Ext</span>'; }

if(!C){
  document.getElementById('subTitle').textContent = code + ' — coming soon';
  ['deck','notesBox','pracBox','revBox'].forEach(function(id){
    document.getElementById(id).innerHTML='<div class="empty">Content for '+code+' is being prepared and will appear here soon.</div>';
  });
}else{
  document.getElementById('subTitle').innerHTML = code.replace('IG','')+' '+C.title+' '+badge(C.tier);
  document.getElementById('subMeta').textContent='Cambridge IGCSE Physics 0625';
  slides=C.slides||[];
  renderDeck(); renderDots();
  document.getElementById('notesBox').innerHTML=C.notes||'<div class="empty">Notes coming soon.</div>';
  document.getElementById('revBox').innerHTML=C.revision||'<div class="empty">Revision coming soon.</div>';
  renderPractice();
}

function renderDeck(){
  document.getElementById('deck').innerHTML = slides.map(function(s,i){
    return '<div class="slide'+(i===0?' active':'')+'"><h2>'+s.title+'</h2>'+s.html+'</div>';
  }).join('');
  updateDeck();
}
function renderDots(){ document.getElementById('dots').innerHTML=slides.map(function(_,i){return '<span class="dot'+(i===0?' on':'')+'"></span>';}).join(''); }
function step(d){ di=Math.max(0,Math.min(slides.length-1,di+d)); updateDeck(); }
function updateDeck(){
  document.querySelectorAll('.slide').forEach(function(s,i){ s.classList.toggle('active',i===di); });
  document.querySelectorAll('.dot').forEach(function(dt,i){ dt.classList.toggle('on',i===di); });
  document.getElementById('prev').disabled=di===0;
  document.getElementById('next').disabled=di===slides.length-1;
  // reveal .f blocks on the active slide
  var act=document.querySelectorAll('.slide')[di];
  if(act) act.querySelectorAll('.f').forEach(function(f){ setTimeout(function(){ f.classList.add('show'); },150); });
  if(window.renderMathInElement) try{ renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}]}); }catch(e){}
}
function renderPractice(){
  var box=document.getElementById('pracBox'); var qs=C.practice||[];
  if(!qs.length){ box.innerHTML='<div class="card"><div class="empty">Practice questions coming soon.</div></div>'; return; }
  box.innerHTML=qs.map(function(q,i){
    var body='';
    if(q.type==='mcq'){
      body=q.options.map(function(o,oi){ return '<button class="opt" onclick="pick(this,'+i+','+oi+')">'+String.fromCharCode(65+oi)+'. '+o+'</button>'; }).join('');
    }else{
      body='<textarea style="width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px" placeholder="Write your answer, then reveal the mark scheme…"></textarea>';
    }
    return '<div class="qc"><div class="qh"><span>Q'+(i+1)+'</span><span class="qmk">['+q.marks+' mark'+(q.marks>1?'s':'')+']</span></div>'+
      '<p>'+q.q+'</p>'+body+
      '<button class="showsol" onclick="toggleSol('+i+')">Show mark scheme ▾</button>'+
      '<div class="sol" id="sol'+i+'">'+q.solution+'</div></div>';
  }).join('');
}
function pick(btn,qi,oi){
  var q=C.practice[qi]; var parent=btn.parentNode;
  parent.querySelectorAll('.opt').forEach(function(b){ b.classList.remove('correct','wrong'); });
  if(oi===q.answer) btn.classList.add('correct');
  else { btn.classList.add('wrong'); parent.querySelectorAll('.opt')[q.answer].classList.add('correct'); }
}
function toggleSol(i){ document.getElementById('sol'+i).classList.toggle('show'); }
function showTab(id,btn){
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById(id==='pres'?'pres':id==='notes'?'notes':id==='prac'?'prac':'rev').classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); }); btn.classList.add('active');
  if(window.renderMathInElement) try{ renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}]}); }catch(e){}
}
</script>
</body>
</html>
