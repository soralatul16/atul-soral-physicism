<script>
document.getElementById('themeBtn').addEventListener('click',function(){var h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);this.textContent=n==='dark'?'🌙':'☀️';});
var $=function(id){return document.getElementById(id)};
var SCENES=[
{n:'Drift in a Wire',g:'<b>Watch electrons drift</b> through a conductor. Apply a voltage to see random thermal motion gain a slow net drift. Adjust current, area, and material. This is <b>I = nAvq</b>.'},
{n:'I = nAvq Explorer',g:'<b>Change each variable</b> and see how drift velocity responds. Compare thin vs thick wires, copper vs semiconductor. Discover why drift velocity is surprisingly slow.'},
{n:'Conventional vs Electron',g:'<b>Compare the two conventions.</b> Conventional current flows + to −; electrons flow − to +. Both describe the same physics. Toggle charge carrier sign.'},
{n:'Material Compare',g:'<b>Same current, different materials.</b> A metal has huge n (fast signal, slow drift); a semiconductor has small n (much faster drift for the same current).'}
];
var scene=0,time=0,paused=false;
$('modes').innerHTML=SCENES.map(function(s,i){return '<div class="mb'+(i===0?' on':'')+'" onclick="setScene('+i+')">'+s.n+'</div>';}).join('');

// Materials: n = number density of free charge carriers (per m^3)
var MATERIALS={
  copper:{n:'Copper',nd:8.5e28,c:'#B45309',q:-1},
  aluminum:{n:'Aluminium',nd:6.0e28,c:'#78909C',q:-1},
  silver:{n:'Silver',nd:5.86e28,c:'#90A4AE',q:-1},
  iron:{n:'Iron',nd:1.7e29,c:'#546E7A',q:-1},
  semiconductor:{n:'Semiconductor (Si, doped)',nd:1e22,c:'#7C3AED',q:-1},
  electrolyte:{n:'Salt Solution',nd:1e26,c:'#0891B2',q:1}
};
var E=1.602e-19;

var S={material:'copper',I:1.0,area:1.0,voltage:5,carrierSign:-1,
  showField:true,showConventional:false,thermal:true,simSpeed:1,
  cmpMatA:'copper',cmpMatB:'semiconductor',cmpI:1.0,cmpArea:1.0};

// Persistent electron/carrier positions for animation
var carriers=[],carriersB=[];
var cv=$('cv'),cx=cv.getContext('2d'),cW,cH;
function resize(){var wp=cv.parentElement;cW=wp.clientWidth;cH=420;var dpr=devicePixelRatio||1;cv.width=cW*dpr;cv.height=cH*dpr;cv.style.width=cW+'px';cv.style.height=cH+'px';cx.setTransform(dpr,0,0,dpr,0,0);}
new ResizeObserver(resize).observe(cv.parentElement);resize();

// ===== PHYSICS =====
// I = n A v q  =>  v = I / (n A q)
// area slider in mm^2, convert to m^2; I in A; n in m^-3
function driftVelocity(I,mat,areaMM2){
  var m=MATERIALS[mat];var A=areaMM2*1e-6;
  return I/(m.nd*A*E); // m/s (magnitude)
}
function fmtSci(v,dp){
  if(v===0)return '0';
  var exp=Math.floor(Math.log10(Math.abs(v)));
  var mant=v/Math.pow(10,exp);
  return mant.toFixed(dp===undefined?2:dp)+'×10'+sup(exp);
}
function sup(n){var m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};return (''+n).split('').map(function(c){return m[c]||c;}).join('');}

function initCarriers(){
  carriers=[];
  var count=90;
  for(var i=0;i<count;i++)carriers.push(mkCarrier());
  carriersB=[];
  for(var j=0;j<count;j++)carriersB.push(mkCarrier());
}
function mkCarrier(){
  return{x:Math.random(),y:Math.random(),
    tvx:(Math.random()-0.5)*2,tvy:(Math.random()-0.5)*2, // thermal velocity (random)
    phase:Math.random()*Math.PI*2};
}

function setScene(i){scene=i;document.querySelectorAll('.mb').forEach(function(b,j){b.classList.toggle('on',j===i);});$('guideBar').innerHTML=SCENES[i].g;buildControls();buildSidebar();buildExp();}
window.setScene=setScene;

// ===== DRAW =====
function draw(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  cx.fillStyle=dark?'#0F172A':'#F8F8F5';cx.fillRect(0,0,cW,cH);
  if(!paused)time+=0.016*S.simSpeed;
  if(scene===0)drawWire(dark);
  else if(scene===1)drawExplorer(dark);
  else if(scene===2)drawConvention(dark);
  else if(scene===3)drawCompare(dark);
}

function drawWireTube(x,y,w,h,mat,dark){
  var m=MATERIALS[mat],rgb=hexToRgb(m.c);
  // wire body gradient
  var g=cx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.5)');
  g.addColorStop(0.5,'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.28)');
  g.addColorStop(1,'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.5)');
  cx.fillStyle=g;cx.fillRect(x,y,w,h);
  cx.strokeStyle='rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.7)';cx.lineWidth=2;cx.strokeRect(x,y,w,h);
  // metal lattice ions (fixed + charges)
  cx.fillStyle=dark?'rgba(255,255,255,0.12)':'rgba(0,0,0,0.10)';
  var cols=Math.max(6,Math.round(w/38)),rows=Math.max(2,Math.round(h/38));
  for(var ci=0;ci<cols;ci++)for(var ri=0;ri<rows;ri++){
    var ix=x+(ci+0.5)*w/cols,iy=y+(ri+0.5)*h/rows;
    cx.beginPath();cx.arc(ix,iy,3,0,Math.PI*2);cx.fill();
  }
}
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}

function drawCarrierSet(list,x,y,w,h,drift,sign,dark,thermal){
  // drift is a normalized on-screen speed (fraction of width per frame direction)
  // sign: -1 electron moves opposite to conventional current (which we take as +x)
  for(var i=0;i<list.length;i++){
    var p=list[i];
    // Motion: net drift + thermal jitter
    var jitter=thermal?0.0016:0;
    if(!paused){
      // thermal random walk
      p.tvx+=(Math.random()-0.5)*0.6;p.tvy+=(Math.random()-0.5)*0.6;
      p.tvx=Math.max(-1.6,Math.min(1.6,p.tvx));p.tvy=Math.max(-1.6,Math.min(1.6,p.tvy));
      // electron drifts in -x if conventional current is +x (sign=-1); positive carrier drifts +x
      var driftDir=(sign<0)?-1:1;
      p.x+=driftDir*drift*S.simSpeed + p.tvx*jitter*S.simSpeed;
      p.y+=p.tvy*jitter*S.simSpeed;
      // wrap strictly within [0,1] so carriers re-enter the far end (charge conservation:
      // an electron leaving one end means another enters the other end)
      if(p.x>=1){p.x-=1;}if(p.x<0){p.x+=1;}
      // reflect off the tube walls so carriers never spill top/bottom
      if(p.y>1){p.y=1;p.tvy=-Math.abs(p.tvy);}if(p.y<0){p.y=0;p.tvy=Math.abs(p.tvy);}
    }
    // inset by the carrier radius (in normalized units) so the full circle stays inside the tube
    var rN=4.5,px=x+rN+p.x*(w-2*rN),py=y+6+rN+p.y*(h-12-2*rN);
    var col=sign<0?'#1D4ED8':'#DC2626';
    cx.beginPath();cx.arc(px,py,4.5,0,Math.PI*2);cx.fillStyle=col;cx.fill();
    cx.fillStyle='rgba(255,255,255,0.85)';cx.font='bold 7px sans-serif';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(sign<0?'−':'+',px,py+0.5);
  }
}

function drawBattery(x,y,label,dark){
  // + terminal on the RIGHT (long line, faces the wire tube), − terminal on the LEFT (short thick line).
  // This makes conventional current flow +x (left→right) through the tube, matching the arrow.
  cx.strokeStyle=dark?'#94A3B8':'#374151';
  cx.lineWidth=5;cx.beginPath();cx.moveTo(x-8,y-9);cx.lineTo(x-8,y+9);cx.stroke();   // short thick = −
  cx.lineWidth=2;cx.beginPath();cx.moveTo(x,y-16);cx.lineTo(x,y+16);cx.stroke();     // long = +
  cx.fillStyle=dark?'#F1F5F9':'#1A1A2E';cx.font='bold 11px sans-serif';cx.textAlign='center';
  cx.fillText('−',x-16,y-20);cx.fillText('+',x+6,y-20);
  if(label){cx.font='600 9px sans-serif';cx.fillStyle=dark?'#94A3B8':'#6B7280';cx.fillText(label,x-4,y+30);}
}

function drawWire(dark){
  var wx=90,wy=cH*0.28,ww=cW-180,wh=90;
  var mat=MATERIALS[S.material];
  var v=driftVelocity(S.I,S.material,S.area);
  // normalized on-screen drift speed (visually scaled - real drift is ~1e-4 m/s so we exaggerate)
  var screenDrift=Math.min(0.02,Math.max(0.0006,v*4));
  // Battery + terminals
  drawBattery(40,wy+wh/2,S.voltage.toFixed(1)+' V',dark);
  // wires to tube
  cx.strokeStyle=dark?'#94A3B8':'#374151';cx.lineWidth=2;
  cx.beginPath();cx.moveTo(48,wy+wh/2);cx.lineTo(wx,wy+wh/2);cx.stroke();
  cx.beginPath();cx.moveTo(wx+ww,wy+wh/2);cx.lineTo(cW-40,wy+wh/2);cx.lineTo(cW-40,wy+wh/2+60);cx.lineTo(40,wy+wh/2+60);cx.lineTo(40,wy+wh/2+16);cx.stroke();
  drawWireTube(wx,wy,ww,wh,S.material,dark);
  drawCarrierSet(carriers,wx,wy,ww,wh,screenDrift,S.carrierSign,dark,S.thermal);
  // Conventional current arrow (top)
  if(S.showConventional){
    cx.strokeStyle='#DC2626';cx.lineWidth=2.5;
    var ay=wy-14;var ax=wx+ww*(0.5+0.12*Math.sin(time*2));
    cx.beginPath();cx.moveTo(wx+30,ay);cx.lineTo(wx+ww-30,ay);cx.stroke();
    cx.fillStyle='#DC2626';cx.beginPath();cx.moveTo(wx+ww-30,ay);cx.lineTo(wx+ww-40,ay-5);cx.lineTo(wx+ww-40,ay+5);cx.closePath();cx.fill();
    cx.font='bold 10px sans-serif';cx.textAlign='center';cx.fillText('Conventional current I (+ to −)',wx+ww/2,ay-8);
  }
  // Drift velocity arrow (on carriers)

  h+='<div class="si"><div class="sl2">A</div><div class="sv3">'+(scene===3?S.cmpArea:S.area).toFixed(2)+' mm²</div></div>';

  h+='<div class="si"><div class="sl2">carrier</div><div class="sv3">'+(mat.q<0?'e⁻':'ion⁺')+'</div></div>';
  h+='</div></div>';
  h+='<div class="sc"><h4>Equation</h4><div class="eq-box"><strong>I = nAvq</strong><br>v = I/(nAq)<br><br>Charge in time t:<br>Q = It<br>Carriers passing: N = nAvt</div></div>';
  if(scene===0){h+='<div class="sc"><h4>Why so slow?</h4><div class="rd">Drift velocity is typically <b>~10⁻⁴ m/s</b> in copper — slower than a snail. Yet lights turn on instantly because the electric field propagates through the wire near light speed, pushing <i>all</i> electrons at once.</div></div>';}
  if(scene===1){h+='<div class="sc"><h4>Relationships</h4><div class="rd">v ∝ I (more current, faster drift)<br>v ∝ 1/n (denser → slower)<br>v ∝ 1/A (thicker → slower)<br><br>Try a semiconductor: tiny n gives a huge drift velocity for the same current.</div></div>';}
  if(scene===2){h+='<div class="sc"><h4>Two Conventions</h4><div class="rd"><b>Conventional:</b> + to − (historical)<br><b>Electron flow:</b> − to +<br><br>Both give the same I. The sign of q in I=nAvq handles the direction automatically.</div></div>';}
  if(scene===3){var vb=driftVelocity(S.cmpI,S.cmpMatB,S.cmpArea);h+='<div class="sc"><h4>Comparison</h4><div class="rd"><b>Top v</b> = '+fmtSci(v,2)+' m/s<br><b>Bottom v</b> = '+fmtSci(vb,2)+' m/s<br><br>Lower n → higher drift velocity for the same current. Semiconductors have far fewer carriers than metals.</div></div>';}
  // Ionic conduction note whenever a positive-carrier material is active
  var activeMat=scene===3?S.cmpMatA:S.material;
  if(MATERIALS[activeMat]&&MATERIALS[activeMat].q>0){
    h+='<div class="sc"><h4>Why ions drift the other way</h4><div class="rd">In a <b>metal</b>, the charge carriers are free <b>electrons</b> (negative), so they drift from − to +, opposite to the conventional current.<br><br>In a <b>salt solution</b>, the carriers are <b>positive ions</b> (e.g. Na⁺). A positive charge in the same field feels a force in the opposite direction to an electron, so it drifts from + to − — the <b>same</b> direction as the conventional current.<br><br>In I = nAv<b>q</b>, the sign of q flips, so the carriers move the opposite way while the current I stays in the same direction. (A real electrolyte also has negative ions, e.g. Cl⁻, drifting the other way — both add to the total current.)</div></div>';
  }
  $('sidebar').innerHTML=h;}

function getIVN(){var v=$('expIV')?$('expIV').value:'I';for(var i=0;i<SIM_VARS.iv.length;i++)if(SIM_VARS.iv[i].id===v)return SIM_VARS.iv[i].n;return SIM_VARS.iv[0].n;}
function getDVN(){var v=$('expDV')?$('expDV').value:'v';for(var i=0;i<SIM_VARS.dv.length;i++)if(SIM_VARS.dv[i].id===v)return SIM_VARS.dv[i].n;return SIM_VARS.dv[0].n;}
function fmtV(v){if(typeof v!=='number')return v;if(Math.abs(v)<0.001&&v!==0)return v.toExponential(3);if(Math.abs(v)>=1e6)return v.toExponential(3);return parseFloat(v.toFixed(5)).toString();}
function getSimIV(){var iv=$('expIV')?$('expIV').value:'I';if(iv==='I')return S.I;if(iv==='area')return S.area;if(iv==='nd')return MATERIALS[S.material].nd;return S.I;}
function getSimDV(){var dv=$('expDV')?$('expDV').value:'v';var v=driftVelocity(S.I,S.material,S.area);if(dv==='v')return v;if(dv==='N')return MATERIALS[S.material].nd*(S.area*1e-6)*v;return v;}

function buildExp(){
  var ivSel=$('expIV')?$('expIV').value:SIM_VARS.iv[0].id,dvSel=$('expDV')?$('expDV').value:SIM_VARS.dv[0].id;
  var ivN=getIVN(),dvN=getDVN();var cvItems=SIM_VARS.all.filter(function(v){return v!==ivN.split(' ')[0]&&!ivN.startsWith(v)&&!dvN.startsWith(v);});
  var h='<div class="exp-panel"><div class="exp-title">Experiment Variables</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">';
  h+='<div class="exp-var"><label class="exp-label iv">Independent Variable (IV)</label><select class="exp-select" id="expIV" onchange="buildExp()">'+SIM_VARS.iv.map(function(v){return '<option value="'+v.id+'"'+(v.id===ivSel?' selected':'')+'>'+v.n+'</option>';}).join('')+'</select></div>';
  h+='<div class="exp-var"><label class="exp-label dv">Dependent Variable (DV)</label><select class="exp-select" id="expDV" onchange="buildExp()">'+SIM_VARS.dv.map(function(v){return '<option value="'+v.id+'"'+(v.id===dvSel?' selected':'')+'>'+v.n+'</option>';}).join('')+'</select></div></div>';
  h+='<div class="exp-var"><label class="exp-label cv">Controlled Variables (CV)</label><div class="exp-cv-list">';cvItems.forEach(function(v){h+='<label class="exp-cv-item"><input type="checkbox" checked> '+v+'</label>';});h+='</div></div>';
  var hypDir=$('hypDir')?$('hypDir').value:'increase';
  h+='<div class="exp-var"><label class="exp-label hyp">Hypothesis</label><div class="exp-hypothesis">"If <strong class="iv-hl">'+ivN+'</strong> is increased, then <strong class="dv-hl">'+dvN+'</strong> will <select class="hyp-dir" id="hypDir"><option'+(hypDir==='increase'?' selected':'')+'>increase</option><option'+(hypDir==='decrease'?' selected':'')+'>decrease</option><option'+(hypDir==='remain constant'?' selected':'')+'>remain constant</option></select>, while keeping the controlled variables constant."</div></div></div>';
  h+='<div class="exp-data"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-family:Georgia,serif;font-size:.8rem;font-weight:700;color:var(--accent)">Data Collection</span></div>';
  h+='<div style="display:flex;gap:3px;align-items:end;margin-bottom:4px"><div style="flex:1"><label style="font-size:.6rem;font-weight:700;color:#2563eb">IV</label><div style="display:flex;gap:2px"><input class="num-input" id="mIV" style="width:100%"><button class="btn btn-s" onclick="rIV()" style="font-size:.58rem;padding:2px 4px">Read</button></div></div>';
  h+='<div style="flex:1"><label style="font-size:.6rem;font-weight:700;color:#dc2626">DV</label><div style="display:flex;gap:2px"><input class="num-input" id="mDV" style="width:100%"><button class="btn btn-s" onclick="rDV()" style="font-size:.58rem;padding:2px 4px">Read</button></div></div>';
  h+='<button class="btn btn-p" onclick="addR()" style="font-size:.58rem;padding:3px 5px">+Add</button><button class="btn btn-ok" onclick="aAdd()" style="font-size:.58rem;padding:3px 5px">Auto</button></div>';
  h+='<div id="mT"></div><div style="display:flex;gap:3px;margin-top:3px"><button class="btn btn-ok" onclick="plotM()">Plot</button><button class="btn btn-s" onclick="clrM()">Clear</button><button class="btn btn-s" onclick="expCSV()">Export CSV</button></div></div>';
  $('expC').innerHTML=h;}
window.rIV=function(){if($('mIV'))$('mIV').value=fmtV(getSimIV());};
window.rDV=function(){if($('mDV'))$('mDV').value=fmtV(getSimDV());};
window.aAdd=function(){rIV();rDV();addR();};
window.addR=function(){var iv=parseFloat($('mIV')?$('mIV').value:0),dv=parseFloat($('mDV')?$('mDV').value:0);if(isNaN(iv)||isNaN(dv))return;manD.push({iv:iv,dv:dv});if($('mIV'))$('mIV').value='';if($('mDV'))$('mDV').value='';buildMT();syncM();addN('Data','IV='+fmtV(iv)+', DV='+fmtV(dv),'#'+manD.length);};
function buildMT(){if(!manD.length){if($('mT'))$('mT').innerHTML='';return;}var rows='';manD.forEach(function(d,i){rows+='<tr><td>'+fmtV(d.iv)+'</td><td>'+fmtV(d.dv)+'</td><td><span style="cursor:pointer;color:var(--err);opacity:.5" onclick="rmPt('+i+')">×</span></td></tr>';});if($('mT'))$('mT').innerHTML='<table class="dt"><thead><tr><th>'+getIVN()+'</th><th>'+getDVN()+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';}
window.rmPt=function(i){manD.splice(i,1);buildMT();syncM();};window.clrM=function(){manD=[];expD=[];buildMT();if($('dW'))$('dW').innerHTML='<p style="font-size:.6rem;color:var(--text3);text-align:center;padding:6px">Record data points first.</p>';drawGr();};
function syncM(){expD=manD.slice().sort(function(a,b){return a.iv-b.iv;});buildDT();setTimeout(function(){initGr();drawGr();},30);}
function buildDT(){if(!expD.length)return;$('dW').innerHTML='<table class="dt"><thead><tr><th>'+getIVN()+'</th><th>'+getDVN()+'</th></tr></thead><tbody>'+expD.map(function(r){return '<tr><td>'+fmtV(r.iv)+'</td><td class="mean">'+fmtV(r.dv)+'</td></tr>';}).join('')+'</tbody></table>';}
window.plotM=function(){if(!manD.length)return;syncM();document.querySelectorAll('.bt').forEach(function(t){t.classList.remove('on');});document.querySelectorAll('.btc').forEach(function(t){t.classList.remove('on');});document.querySelectorAll('.bt')[1].classList.add('on');$('b1').classList.add('on');setTimeout(function(){initGr();drawGr();},80);};
window.expCSV=function(){if(!manD.length)return;var csv=getIVN()+','+getDVN()+'\n';manD.forEach(function(d){csv+=fmtV(d.iv)+','+fmtV(d.dv)+'\n';});var b=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='drift_velocity_data.csv';a.click();};
window.savePlot=function(){if(!gCv)return;var a=document.createElement('a');a.href=gCv.toDataURL('image/png');a.download='drift_velocity_plot.png';a.click();};
window.togGrid=function(){showGrid=!showGrid;drawGr();};window.togBF=function(){showBF=!showBF;drawGr();};

var gCv,gx2;function initGr(){gCv=$('gC');if(!gCv)return;gx2=gCv.getContext('2d');var d=devicePixelRatio||1,r=gCv.parentElement.getBoundingClientRect(),w=r.width;if(w<10)return;gCv.width=w*d;gCv.height=190*d;gCv.style.width=w+'px';gCv.style.height='190px';gx2.setTransform(d,0,0,d,0,0);}
function drawGr(){if(!gCv||!gx2){initGr();if(!gCv)return;}var w=parseInt(gCv.style.width)||500,h=190;gx2.clearRect(0,0,w,h);var dark=document.documentElement.getAttribute('data-theme')==='dark';gx2.fillStyle=dark?'#1E293B':'#fff';gx2.fillRect(0,0,w,h);if(!expD.length){gx2.fillStyle='#bbb';gx2.font='11px sans-serif';gx2.textAlign='center';gx2.fillText('Record data and click Plot',w/2,h/2);return;}var P={t:16,r:14,b:32,l:58},pW=w-P.l-P.r,pH=h-P.t-P.b;var xs=expD.map(function(r2){return r2.iv;}),ys=expD.map(function(r2){return r2.dv;});var xn=Math.min.apply(null,xs),xx=Math.max.apply(null,xs),yn=Math.min.apply(null,ys),yx=Math.max.apply(null,ys);if(xx-xn<1e-12){xn-=1;xx+=1;}if(yx-yn<1e-12){yn-=Math.abs(yn)*.1||1;yx+=Math.abs(yx)*.1||1;}var xp=(xx-xn)*.1,yp=(yx-yn)*.1;xn-=xp;xx+=xp;yn-=yp;yx+=yp;var tx=function(v){return P.l+((v-xn)/(xx-xn))*pW;},ty=function(v){return P.t+pH-((v-yn)/(yx-yn))*pH;};if(showGrid){gx2.strokeStyle=dark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)';gx2.lineWidth=.5;for(var i=0;i<=5;i++){gx2.beginPath();gx2.moveTo(tx(xn+(xx-xn)*i/5),P.t);gx2.lineTo(tx(xn+(xx-xn)*i/5),P.t+pH);gx2.stroke();gx2.beginPath();gx2.moveTo(P.l,ty(yn+(yx-yn)*i/5));gx2.lineTo(P.l+pW,ty(yn+(yx-yn)*i/5));gx2.stroke();}}gx2.strokeStyle=dark?'rgba(255,255,255,.3)':'rgba(0,0,0,.3)';gx2.lineWidth=1.5;gx2.beginPath();gx2.moveTo(P.l,P.t);gx2.lineTo(P.l,P.t+pH);gx2.lineTo(P.l+pW,P.t+pH);gx2.stroke();gx2.fillStyle=dark?'#94A3B8':'#888';gx2.font='9px sans-serif';gx2.textAlign='center';for(var i3=0;i3<=5;i3++)gx2.fillText(fmtV(xn+(xx-xn)*i3/5),tx(xn+(xx-xn)*i3/5),P.t+pH+12);gx2.textAlign='right';for(var i4=0;i4<=5;i4++)gx2.fillText(fmtV(yn+(yx-yn)*i4/5),P.l-4,ty(yn+(yx-yn)*i4/5)+3);gx2.fillStyle=dark?'#E2E8F0':'#555';gx2.font='bold 9px sans-serif';gx2.textAlign='center';gx2.fillText(getIVN(),P.l+pW/2,h-3);gx2.save();gx2.translate(11,P.t+pH/2);gx2.rotate(-Math.PI/2);gx2.fillText(getDVN(),0,0);gx2.restore();
  if(showBF&&xs.length>=2){var n=xs.length,sx=0,sy=0,sxy=0,sx2=0;for(var bf=0;bf<n;bf++){sx+=xs[bf];sy+=ys[bf];sxy+=xs[bf]*ys[bf];sx2+=xs[bf]*xs[bf];}var bfM=(n*sxy-sx*sy)/(n*sx2-sx*sx),bfB=(sy-bfM*sx)/n;var ssRes=0,ssTot=0,yMean=sy/n;for(var bf2=0;bf2<n;bf2++){var yPred=bfM*xs[bf2]+bfB;ssRes+=(ys[bf2]-yPred)*(ys[bf2]-yPred);ssTot+=(ys[bf2]-yMean)*(ys[bf2]-yMean);}var r2v=ssTot>0?1-ssRes/ssTot:0;gx2.strokeStyle='rgba(220,38,38,.5)';gx2.lineWidth=1.5;gx2.setLineDash([6,4]);gx2.beginPath();gx2.moveTo(tx(xn),ty(bfM*xn+bfB));gx2.lineTo(tx(xx),ty(bfM*xx+bfB));gx2.stroke();gx2.setLineDash([]);gx2.fillStyle='rgba(220,38,38,.7)';gx2.font='9px sans-serif';gx2.textAlign='right';gx2.fillText('R²='+r2v.toFixed(4),P.l+pW,P.t+10);}
  if(xs.length>=2){gx2.strokeStyle='#B45309';gx2.lineWidth=1.5;gx2.beginPath();expD.forEach(function(r2,i5){i5===0?gx2.moveTo(tx(r2.iv),ty(r2.dv)):gx2.lineTo(tx(r2.iv),ty(r2.dv));});gx2.stroke();}gx2.fillStyle='#B45309';xs.forEach(function(x,i5){gx2.beginPath();gx2.arc(tx(x),ty(ys[i5]),4,0,Math.PI*2);gx2.fill();gx2.strokeStyle=dark?'#1E293B':'#fff';gx2.lineWidth=1.5;gx2.stroke();});}

// ===== IB QUESTIONS =====
var IB=[
{c:'State',q:'State what is meant by electric current.',f:'Electric current is the rate of flow of charge: I = ΔQ/Δt. SI unit: ampere (A) = C/s. Conventional current is defined as the direction of flow of positive charge.'},
{c:'Calc',q:'A copper wire has cross-sectional area 1.0 mm² and carries 1.0 A. Copper has n = 8.5×10²⁸ m⁻³. Find the drift velocity.',f:'v = I/(nAq) = 1.0 / (8.5×10²⁸ × 1.0×10⁻⁶ × 1.6×10⁻¹⁹) = <strong>7.4×10⁻⁵ m/s</strong> (about 0.074 mm/s — extremely slow).'},
{c:'Explain',q:'If drift velocity is so slow (~10⁻⁴ m/s), why does a lamp light up almost instantly when you flip the switch?',f:'The electric field is established throughout the circuit at close to the speed of light. This field acts on <strong>all</strong> the free electrons simultaneously, so every electron (including those already in the lamp filament) begins to drift almost at once. It is not the individual electrons travelling from the switch to the lamp that matters, but the near-instant propagation of the field.'},
{c:'Calc',q:'The same 1.0 A current flows through a doped semiconductor with n = 1.0×10²² m⁻³ (same 1.0 mm² area). Find the drift velocity and compare to copper.',f:'v = 1.0/(1.0×10²² × 1.0×10⁻⁶ × 1.6×10⁻¹⁹) = <strong>625 m/s</strong>. This is roughly 8.5 million times faster than in copper, because the semiconductor has vastly fewer charge carriers (smaller n), so each must move much faster to carry the same current.'},
{c:'Explain',q:'Explain the difference between conventional current and electron flow.',f:'Conventional current is defined as the direction positive charge would flow: from + to − terminal. Electrons (the actual charge carriers in a metal) are negative, so they flow the opposite way: from − to +. Both describe the same physical current; conventional current was defined before the electron was discovered.'},
{c:'Calc',q:'A wire carries 2.0 A. How much charge passes a point in 5.0 minutes, and how many electrons is this?',f:'Q = It = 2.0 × (5.0×60) = <strong>600 C</strong>. Number of electrons = Q/e = 600 / 1.6×10⁻¹⁹ = <strong>3.75×10²¹ electrons</strong>.'},
{c:'Explain',q:'A wire narrows to half its cross-sectional area partway along. What happens to the drift velocity in the narrow section, and why?',f:'Current I must be the same everywhere (charge conservation). Since I = nAvq and n, q are unchanged, halving A must <strong>double the drift velocity</strong> v. Electrons speed up through the constriction to carry the same current through a smaller area.'}
];
function buildIB(){$('ibL').innerHTML=IB.map(function(q,i){var cls=q.c==='Calc'?'c':q.c==='Explain'?'e':'s';return '<div class="q-item"><div class="q-header" onclick="sF('+i+')"><span class="q-cmd q-cmd-'+cls+'">'+q.c+'</span><span class="q-text">'+q.q+'</span><span class="q-marks">['+(q.c==='State'?1:q.c==='Calc'?3:3)+']</span><span class="q-toggle">Show</span></div><div class="q-answer" id="iF'+i+'">'+q.f+'</div></div>';}).join('');}
window.sF=function(i){var a=$('iF'+i);a.classList.toggle('open');a.previousElementSibling.querySelector('.q-toggle').textContent=a.classList.contains('open')?'Hide':'Show';};

// ===== NOTEBOOK =====
var nb=[];function addN(t,d,r){nb.push({t:t,d:d,r:r});showN();}
function showN(){$('nbO').innerHTML=nb.length?nb.map(function(n,i){return '<div class="nb-c"><b>#'+(i+1)+' '+n.t+'</b><br>'+n.d+'<br><span class="nr">→ '+n.r+'</span></div>';}).join(''):'<p style="text-align:center;color:var(--text3);font-size:.6rem;padding:6px">Record data to log observations here.</p>';}

initCarriers();
$('guideBar').innerHTML=SCENES[0].g;buildControls();buildSidebar();buildExp();buildIB();showN();requestAnimationFrame(animate);
