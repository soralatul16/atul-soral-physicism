<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATUL SORAL PHYSICISM · Coordinator Console</title>
<style>
  :root{
    --paper1:#eef7f3;
    --paper2:#eef1fb;
    --paper3:#faf1f5;
    --surface:#ffffff;
    --surface-2:#f3f6fb;
    --ink:#2b3444;
    --ink-soft:#5d6882;
    --ink-mute:#9aa3b8;
    --line:#eceff6;
    --line-strong:#dde3ee;
    --brand:#4fa89a;        /* soft teal */
    --brand-2:#7c8fd4;      /* periwinkle */
    --brand-grad:linear-gradient(135deg,#5bb5a6,#7c8fd4);
    --accent:#4fa89a;
    --accent-soft:#dcefe9;
    --good:#3a9e7a;
    --good-soft:#def1e8;
    --warn:#c08a2e;
    --warn-soft:#f8eed6;
    --crit:#cf6a7a;
    --crit-soft:#fbe4e9;
    --info:#5f7fc4;
    --info-soft:#e7edfa;
    --sky-grad:linear-gradient(135deg,#eaf1fe,#dde8fb);
    --rose-grad:linear-gradient(135deg,#fdeef2,#fbe0e8);
    --peach-grad:linear-gradient(135deg,#fdf2ea,#fce6d6);
    --mint-grad:linear-gradient(135deg,#e7f6ee,#d6f0e4);
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(43,52,68,.04), 0 10px 30px rgba(43,52,68,.06);
    --shadow-lift:0 4px 10px rgba(43,52,68,.08), 0 22px 50px rgba(43,52,68,.12);
    --font-display:'Iowan Old Style','Palatino Linotype','Palatino','Charter','Georgia',serif;
    --font-body:'Avenir Next','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body);
    background:linear-gradient(160deg,var(--paper1) 0%,var(--paper2) 52%,var(--paper3) 100%);
    background-attachment:fixed;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--accent-soft)}

  .app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
  .sidebar{
    background:linear-gradient(180deg,#ffffff 0%,#eef7f3 55%,#eef1fb 100%);
    color:var(--ink);
    border-right:1px solid var(--line);
    padding:22px 16px 70px;
    display:flex;flex-direction:column;gap:4px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
  .brand .mark{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:var(--brand-grad);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1;
    box-shadow:0 8px 18px rgba(92,181,166,.35);
  }
  .brand .name{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink);line-height:1.15;letter-spacing:.02em}
  .brand .sub{font-size:10px;color:var(--ink-mute);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
  .year-switch{padding:2px 8px 14px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .year-switch label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);display:block;margin-bottom:5px;font-weight:700}
  .year-row{display:flex;gap:6px}
  #yearSel{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line-strong);border-radius:9px;background:#fff;font-size:13px;font-weight:700;color:var(--ink);outline:none}
  #yearSel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #yearAdd{width:34px;flex:none;border:1px solid var(--line-strong);border-radius:9px;background:#fff;font-size:16px;color:var(--brand);font-weight:700;line-height:1}
  #yearAdd:hover{border-color:var(--brand);background:var(--accent-soft)}
  .nav-group-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);padding:16px 10px 6px}
  .nav-btn{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;flex-shrink:0;
    background:transparent;border:0;color:var(--ink-soft);padding:9px 11px;border-radius:10px;
    font-size:14px;font-weight:500;transition:background .15s,color .15s;
  }
  .nav-btn .ic{width:17px;height:17px;flex:none;opacity:.7}
  .nav-btn:hover{background:rgba(79,168,154,.1);color:var(--brand)}
  .nav-btn.active{background:var(--brand-grad);color:#fff;box-shadow:0 7px 18px rgba(92,181,166,.32)}
  .nav-btn.active .ic{opacity:1}
  .nav-badge{margin-left:auto;background:var(--surface-2);color:var(--ink-soft);font-size:11px;font-weight:700;
    padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
  .nav-btn.active .nav-badge{background:rgba(255,255,255,.3);color:#fff}
  .nav-badge.alert{background:var(--crit);color:#fff}
  .nav-btn.active .nav-badge.alert{background:rgba(255,255,255,.32);color:#fff}

  .main{padding:26px 32px 90px;max-width:1180px;margin:0 auto;width:100%}
  .topline{display:flex;align-items:center;gap:16px;margin-bottom:6px;flex-wrap:wrap}
  .page-title{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:.2px;margin:0}
  .page-sub{color:var(--ink-soft);font-size:14px;margin:2px 0 22px}
  .spacer{flex:1}
  .search-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-mute)}
  .search{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);border-radius:10px;
    background:var(--surface);font-size:13.5px;color:var(--ink);outline:none}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--brand-grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(92,181,166,.26)}
  .btn.primary:hover{filter:brightness(1.05);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.icon{padding:7px 8px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .section{margin-bottom:26px}
  .section-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .section-head h2{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0}
  .section-head .count{color:var(--ink-mute);font-size:13px;font-weight:600}

  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
  .tile{padding:17px 17px 16px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.65);background:var(--surface);
    cursor:pointer;transition:.18s;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .tile:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
  .tile .tnum{font-family:var(--font-display);font-size:36px;font-weight:600;line-height:1}
  .tile .tlbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-weight:600;letter-spacing:.02em}
  .tile.t-today{background:var(--sky-grad)} .tile.t-today .tnum{color:var(--info)}
  .tile.t-over{background:var(--rose-grad)} .tile.t-over .tnum{color:var(--crit)}
  .tile.t-week{background:var(--peach-grad)} .tile.t-week .tnum{color:#c0812e}
  .tile.t-up{background:var(--mint-grad)} .tile.t-up .tnum{color:var(--good)}

  .capture{background:linear-gradient(135deg,#e9f6f0 0%,#eef1fb 100%);border:1px solid rgba(255,255,255,.75);
    border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);margin-bottom:24px}
  .capture h3{margin:0 0 3px;font-family:var(--font-display);font-size:18px;font-weight:600}
  .capture p.hint{margin:0 0 12px;color:var(--ink-soft);font-size:13px}
  .cap-input{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;
    padding:12px 13px;font-size:15px;color:var(--ink);background:#fff;outline:none;line-height:1.5}
  .cap-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .cap-row{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
  .cap-hint2{color:var(--ink-mute);font-size:12px;flex:1;min-width:160px}
  .chip-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:20px;padding:3px 10px;font-size:12px;color:var(--ink-soft);font-weight:600}
  .chip b{color:var(--ink);font-weight:700}

  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);transition:background .12s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--surface-2)}
  .check{width:19px;height:19px;border:2px solid var(--line-strong);border-radius:6px;flex:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s}
  .check:hover{border-color:var(--good)}
  .check.done{background:var(--good);border-color:var(--good)}
  .check.done svg{color:#fff;width:12px;height:12px}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:14.5px;font-weight:600;color:var(--ink);margin:0}
  .row.done .row-title{text-decoration:line-through;color:var(--ink-mute)}
  .row-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
  .tag.type{background:var(--accent-soft);color:#2f7468}
  .tag.grade{background:var(--info-soft);color:var(--info)}
  .tag.teach{background:#efe9f6;color:#6a5a96}
  .tag.subj{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
  .tag.cat{background:#eef7f3;color:#2f7468;border:1px solid #d6ece4}
  .tag.cat.c-exam{background:var(--crit-soft);color:var(--crit);border-color:#f3cdd5}
  .tag.cat.c-student{background:var(--info-soft);color:var(--info);border-color:#cfe0f3}
  .tag.cat.c-eca{background:var(--warn-soft);color:#b07d22;border-color:#eeddb6}
  .tag.aud{background:#f3eefb;color:#7a5aa6;border:1px solid #e3d6f3}
  .tag.hatt{background:var(--brand);color:#fff;font-weight:700}
  .tag.rem{background:#fff4e2;color:#b06d12;border:1px solid #f0dcb4;cursor:pointer}
  .rem-box{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:170px;overflow-y:auto}
  .rem-item{display:flex;align-items:flex-start;gap:8px;background:#fff;border:1px solid #f0dcb4;border-radius:8px;padding:6px 8px}
  .rem-dot{flex-shrink:0;font-size:13px;line-height:1.4}
  .rem-body{flex:1;min-width:0}
  .rem-body p{margin:0;font-size:13px;font-weight:600;color:var(--ink);word-break:break-word}
  .rem-at{font-size:11px;color:var(--ink-soft)}
  .rem-x{flex-shrink:0;border:none;background:none;color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
  .rem-x:hover{color:var(--crit)}
  .rem-add{display:flex;gap:6px;margin-top:7px}
  .rem-add input{flex:1}
  .act-row{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .act-row:last-child{border-bottom:none}
  .act-row input[type=checkbox]{margin-top:2px;flex-shrink:0;width:17px;height:17px;cursor:pointer}
  .act-row.done .act-main p{text-decoration:line-through;opacity:.5}
  .act-main{flex:1;min-width:0}
  .act-main p{margin:0;font-size:14px;font-weight:600;color:var(--ink);line-height:1.45}
  .act-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .reorder{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
  .rbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:5px;width:22px;height:17px;font-size:9px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .rbtn:hover:not(:disabled){background:var(--brand);color:#fff;border-color:var(--brand)}
  .rbtn:disabled{opacity:.3;cursor:default}
  .due{font-size:12.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .due.over{color:var(--crit)} .due.today{color:var(--warn)} .due.soon{color:var(--accent)} .due.far{color:var(--ink-soft)} .due.none{color:var(--ink-mute);font-weight:500}
  .prio{width:7px;height:7px;border-radius:50%;flex:none}
  .prio.high{background:var(--crit)} .prio.normal{background:transparent}
  .row-del{opacity:0;color:var(--ink-mute);border:0;background:none;padding:4px;border-radius:6px;transition:.12s}
  .row:hover .row-del{opacity:1}
  .row-del:hover{color:var(--crit);background:var(--crit-soft)}

  .pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .pill.ontime{background:var(--good-soft);color:var(--good)}
  .pill.late{background:var(--crit-soft);color:var(--crit)}
  .pill.pending{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
  .pill.overdue{background:var(--warn-soft);color:var(--warn)}
  .dot{width:6px;height:6px;border-radius:50%}
  .dot.good{background:var(--good)} .dot.late{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.mute{background:var(--ink-mute)}

  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);
    font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line-strong);background:var(--surface-2)}
  .tbl td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr:hover td{background:var(--surface-2)}
  .tbl .nm{font-weight:600}
  .mini{font-size:12px;color:var(--ink-mute)}

  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;border:1px solid var(--line);width:fit-content;margin-bottom:16px}
  .tab{border:0;background:transparent;padding:7px 15px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .filt{border:1px solid var(--line-strong);background:var(--surface);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .filt.active{background:var(--brand);border-color:var(--brand);color:#fff}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-mute)}
  .empty .big{font-family:var(--font-display);font-size:17px;color:var(--ink-soft);margin-bottom:4px}

  .alert-strip{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;margin-bottom:10px;font-size:13.5px;font-weight:600}
  .alert-strip.crit{background:var(--crit-soft);color:var(--crit)}
  .alert-strip.warn{background:var(--warn-soft);color:var(--warn)}
  .alert-strip.ok{background:var(--good-soft);color:var(--good)}
  .alert-strip.rem{background:#fff4e2;color:#b06d12}
  .alert-strip .ac{flex:1}
  .alert-strip .go{font-size:12px;text-decoration:underline;cursor:pointer}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:40;transform:translateX(-100%);transition:transform .2s;width:252px}
    .sidebar.open{transform:none}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-2{grid-template-columns:1fr}
    .main{padding:18px 16px 90px}
    .menu-toggle{display:inline-flex!important}
    .scrim.show{display:block}
  }
  .menu-toggle{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(30,38,54,.4);z-index:35}

  .meter{height:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex}
  .meter i{display:block;height:100%}
  .meter i.g{background:var(--good)} .meter i.r{background:var(--crit)} .meter i.m{background:var(--line-strong)}
  .legend{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600}

  .modal-scrim{position:fixed;inset:0;background:rgba(30,38,54,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal-scrim.show{display:flex}
  .modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;box-shadow:var(--shadow-lift);max-height:88vh;overflow:auto}
  .modal-head{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-family:var(--font-display);font-size:19px;margin:0;flex:1}
  .modal-body{padding:14px 20px 20px;display:flex;flex-direction:column;gap:13px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;font-size:14px;background:#fff;color:var(--ink);outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .fld-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .modal-foot{padding:0 20px 20px;display:flex;gap:9px;justify-content:flex-end}
  .x{border:0;background:none;color:var(--ink-mute);font-size:22px;line-height:1;padding:0 4px}

  .gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(160deg,#e9f6f0,#eef1fb 55%,#faf1f5)}
  .gate.hidden{display:none}
  .gate-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lift);padding:30px 28px;max-width:360px;width:100%;text-align:center}
  .gate-card .mark{width:52px;height:52px;border-radius:15px;margin:0 auto 14px;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:28px;box-shadow:0 10px 22px rgba(92,181,166,.35)}
  .gate-card h2{font-family:var(--font-display);font-size:20px;margin:0 0 3px}
  .gate-card p{color:var(--ink-soft);font-size:13px;margin:0 0 18px}
  .gate-card input{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:10px;font-size:16px;text-align:center;letter-spacing:.1em;outline:none}
  .gate-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .gate-card .err{color:var(--crit);font-size:12.5px;font-weight:600;margin-top:9px;display:none}
  .gate-card button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--brand-grad);color:#fff;font-weight:700;font-size:14px;box-shadow:0 6px 16px rgba(92,181,166,.3)}
  .toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand);color:#fff;
    padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lift);opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .spinner{width:30px;height:30px;border:3px solid var(--line-strong);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ai-note{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:#2f7468;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600;margin-top:2px}

<script>
/* ===================== State ===================== */
const KEY='asp_tracker_v1';
const DEFAULT_TEACHERS=['Atul Soral','Priya Menon','Rahul Verma','Sana Khan'];
const GRADES=['Grade 9','Grade 10','Grade 11','Grade 12'];
const HATS=['Coordinator','Physics Teacher','Form Tutor','CAS Advisor'];
const PROGRAMME={'Grade 9':'IGCSE','Grade 10':'IGCSE','Grade 11':'IB DP','Grade 12':'IB DP'};
const PROG_GROUPS=[['IGCSE',['Grade 9','Grade 10']],['IB DP',['Grade 11','Grade 12']]];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
const PERIODS=['P1','P2','P3','P4','P5','P6','P7'];
const ROLES=['Teacher','Coordinator','HOD'];
const MKEY='asp_tracker_multi_v1';
/* ===== Passcode: change the value below to set your own. Keep the quotes. ===== */
const ACCESS_CODE='soralism';
const DEFAULT_AI_URL='https://asp-extract.atulsoralphysicism.workers.dev';
function curAcademicYear(){const d=new Date();const y=d.getFullYear();return (d.getMonth()>=3)?`${y}–${String(y+1).slice(-2)}`:`${y-1}–${String(y).slice(-2)}`;}
function blankYear(){return {tasks:[],corrections:[],docs:[],ias:[],staff:[],outlines:[],meetings:[],settings:{teachers:[...DEFAULT_TEACHERS]}};}
function normYear(yr){yr.tasks=yr.tasks||[];yr.corrections=yr.corrections||[];yr.docs=yr.docs||[];yr.ias=yr.ias||[];yr.staff=yr.staff||[];yr.outlines=yr.outlines||[];yr.meetings=yr.meetings||[];yr.settings=yr.settings||{teachers:[...DEFAULT_TEACHERS]};yr.tasks.forEach(t=>{if(!t.kind)t.kind='task';if(!Array.isArray(t.reminders))t.reminders=[];});return yr;}
function loadStore(){
  try{const s=JSON.parse(localStorage.getItem(MKEY));if(s&&s.years&&s.activeYear&&s.years[s.activeYear]){Object.values(s.years).forEach(normYear);s.view=s.view||'dashboard';s.seeded=s.seeded!==false;if(!s.trash)s.trash=[];return s;}}catch(e){}
  try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.tasks){const y=curAcademicYear();return {activeYear:y,view:o.view||'dashboard',seeded:true,trash:[],years:{[y]:normYear({tasks:o.tasks,corrections:o.corrections,docs:o.docs,ias:o.ias,staff:o.staff,settings:o.settings})}};}}catch(e){}
  const y=curAcademicYear();return {activeYear:y,view:'dashboard',seeded:false,trash:[],years:{[y]:blankYear()}};
}
let store=loadStore();
let state=store.years[store.activeYear];
let view=store.view||'dashboard';
function yearList(){return Object.keys(store.years).sort((a,b)=>parseInt(a)-parseInt(b));}
function syncTeacherNames(){if(state.staff&&state.staff.length)state.settings.teachers=state.staff.map(s=>s.name);}
function save(){syncTeacherNames();store.years[store.activeYear]=state;store.view=view;localStorage.setItem(MKEY,JSON.stringify(store));refreshBadges();}
function switchYear(y){if(!store.years[y]||y===store.activeYear)return;store.activeYear=y;state=store.years[y];save();render();highlightNav();populateYears();toast('Switched to '+y);}
function suggestNextYear(){let max=0;yearList().forEach(y=>{const m=y.match(/(\d{4})\D+(\d{2,4})/);if(m){let e=+m[2];if(e<100)e=2000+e;if(e>max)max=e;}});if(!max){const c=curAcademicYear();return c;}return `${max}–${String(max+1).slice(-2)}`;}
function addYear(label,carryStaff){
  if(store.years[label]){switchYear(label);return;}
  const yr=blankYear();
  if(carryStaff&&state.staff&&state.staff.length){yr.staff=state.staff.map(s=>({...s,id:uid(),classes:[...(s.classes||[])],timetable:(s.timetable||[]).map(x=>({...x}))}));yr.settings={teachers:yr.staff.map(s=>s.name)};}
  store.years[label]=yr;store.activeYear=label;state=yr;save();render();highlightNav();populateYears();toast('Created '+label);
}
function populateYears(){const sel=document.getElementById('yearSel');if(!sel)return;sel.innerHTML=yearList().map(y=>`<option ${y===store.activeYear?'selected':''}>${esc(y)}</option>`).join('');}
function binItem(coll,id,type){
  const arr=state[coll];if(!arr)return;const i=arr.findIndex(x=>x.id===id);if(i<0)return;
  const obj=arr.splice(i,1)[0];
  if(!store.trash)store.trash=[];
  store.trash.push({tid:uid(),type:type,coll:coll,year:store.activeYear,obj:obj,deletedAt:Date.now()});
  save();render();toast('Moved to Trash');
}
function restoreTrash(tid){
  if(!store.trash)return;const i=store.trash.findIndex(t=>t.tid===tid);if(i<0)return;
  const rec=store.trash.splice(i,1)[0];
  const yr=store.years[rec.year]||state;yr[rec.coll]=yr[rec.coll]||[];yr[rec.coll].push(rec.obj);
  save();render();toast('Restored');
}
function purgeTrash(tid){store.trash=(store.trash||[]).filter(t=>t.tid!==tid);save();render();toast('Deleted permanently');}
function emptyTrash(){if(confirm('Permanently delete everything in Trash? This cannot be undone.')){store.trash=[];save();render();toast('Trash emptied');}}
let taskFilter='all', corrTab='mine', searchQ='', ttDate='', ttWeek='A', iaView='list', taskHat='all', taskKind='all', outlineGrade='', stuGrade='all', stuSel=new Set(), stuHL='all', stuTeacher='all', stuTask='all', stuEE='all', iaStageF='all', iaTeacherF='all', iaBlockF='all', meetFilter='all', meetingOpenId=null, stuBlock='all';

/* ===================== Helpers ===================== */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayISO=()=>{const d=new Date();return d.toISOString().slice(0,10)};
function dOnly(iso){return iso?new Date(iso+'T00:00:00'):null;}
function daysBetween(aIso,bIso){
  const a=dOnly(aIso),b=dOnly(bIso);if(!a||!b)return null;
  return Math.round((b-a)/86400000);
}
function fmtDate(iso){
  if(!iso)return '';
  const d=dOnly(iso);const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${m[d.getMonth()]}`;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ===================== Natural-language classifier ===================== */
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11,
  january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};

function parseDate(text){
  const t=text.toLowerCase();const now=new Date();const y=now.getFullYear();
  if(/\btoday\b/.test(t))return todayISO();
  if(/\btomorrow\b|\btmrw\b/.test(t)){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
  let m;
  if(m=t.match(/\bin (\d{1,3}) days?\b/)){const d=new Date();d.setDate(d.getDate()+(+m[1]));return d.toISOString().slice(0,10);}
  if(/\bnext week\b/.test(t)){const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10);}
  if(/\bend of (the )?week\b/.test(t)){const d=new Date();const add=(5-d.getDay()+7)%7||5;d.setDate(d.getDate()+add);return d.toISOString().slice(0,10);}
  const days={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
  for(const k in days){if(new RegExp('\\b'+k+'\\b').test(t)){const d=new Date();const add=(days[k]-d.getDay()+7)%7||7;d.setDate(d.getDate()+add);return d.toISOString().slice(0,10);}}
  if(m=t.match(/\b(20\d{2})[-/](\d{1,2})[-/](\d{1,2})\b/))return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  if(m=t.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/)){
    let yr=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):y;
    return `${yr}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
  }
  if(m=t.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s*([a-z]{3,9})\b/)){
    if(MONTHS[m[2]]!=null){let mon=MONTHS[m[2]];let date=new Date(y,mon,+m[1]);if(date<new Date(now.toDateString()))date=new Date(y+1,mon,+m[1]);return date.toISOString().slice(0,10);}
  }
  if(m=t.match(/\b([a-z]{3,9})\s*(\d{1,2})(?:st|nd|rd|th)?\b/)){
    if(MONTHS[m[1]]!=null){let mon=MONTHS[m[1]];let date=new Date(y,mon,+m[2]);if(date<new Date(now.toDateString()))date=new Date(y+1,mon,+m[2]);return date.toISOString().slice(0,10);}
  }
  return null;
}

function hatFromText(t){t=' '+(''+(t||'')).toLowerCase()+' ';
  if(/co[- ]?ordinator|coordinat/.test(t))return 'Coordinator';
  if(/form tutor|mentor|mentee|tutor group|pastoral/.test(t))return 'Form Tutor';
  if(/\bcas\b|creativity|cas advisor|cas project/.test(t))return 'CAS Advisor';
  if(/my class|my lesson|i teach|lesson plan|teaching|physics teacher/.test(t))return 'Physics Teacher';
  return '';
}
function classify(text){
  const t=' '+text.toLowerCase()+' ';
  let grade='';
  if(/\bgrade 9\b|\bg9\b|\bclass 9\b/.test(t))grade='Grade 9';
  else if(/\bgrade 10\b|\bg10\b|\bclass 10\b/.test(t))grade='Grade 10';
  else if(/\bgrade 11\b|\bg11\b|\bclass 11\b|\bdp ?1\b|\bdp1\b/.test(t))grade='Grade 11';
  else if(/\bgrade 12\b|\bg12\b|\bclass 12\b|\bdp ?2\b|\bdp2\b/.test(t))grade='Grade 12';
  else if(/\bigcse\b|\bicgse\b/.test(t))grade='Grade 10';
  const typeMap=[
    ['Moderation',/\bmoderat/],['Standardisation',/\bstandardi[sz]/],['Markscheme',/\bmark ?scheme|\bms\b/],
    ['Question Paper',/\bquestion paper|\bqp\b|\bpaper\b/],['Correction',/\bcorrect|\bmarking\b|\bcopies\b|\bscript|\banswer cop/],
    ['IA',/\binternal assessment\b|\bia\b/],['EE',/\bextended essay\b|\bee\b/],
    ['Observation',/\bobservation|\blearning walk\b/],['Meeting',/\bmeeting\b|\bmom\b|\bminutes\b/],
    ['Predicted Grade',/\bpredicted grade|\bpg\b/],['Intervention',/\bintervention|\bextra class|\bremedial\b/],
    ['Assessment',/\bassessment|\btest\b|\bexam\b|\bquiz\b/],['Report',/\breport\b/],
    ['Lesson Plan',/\blesson plan/],['Unit Plan',/\bunit plan|\bunit planner/],['Syllabus',/\bsyllabus|\bcurriculum/],
  ];
  let type='Task';
  for(const [name,re] of typeMap){if(re.test(t)){type=name;break;}}
  let teacher='';
  for(const tn of state.settings.teachers){if(t.includes(' '+tn.toLowerCase()+' ')||t.includes(' '+tn.toLowerCase()+"'")){teacher=tn;break;}}
  const priority=/\burgent|\basap|\bhigh priority|\bimportant|\bcritical|!!/.test(t)?'high':'normal';
  const due=parseDate(text);
  let category='';
  if(/\bexam|\btest\b|\bpaper\b|\bmark ?scheme|\bmoderat|\bstandardi[sz]|\bcorrect|\bmarking\b|\bpredicted grade|\bresult\b|\bgrading\b/.test(t))category='Exam';
  else if(/\bstudent|\binternal assessment\b|\bia\b|\bextended essay\b|\bee\b|\bintervention|\bremedial|\bptm\b|\bparent[- ]?teacher|\bparent\b|\breport card|\bpersonalised lesson|\bpersonalized lesson|\bpl\b/.test(t))category='Student';
  else if(/\beca\b|\bco[- ]?curricular|\bclub\b|\bactivit|\btrip\b|\bexcursion|\bcompetition|\bolympiad|\bmasterclass|\bfest\b|\bassembly\b|\bcelebration|\bevent\b/.test(t))category='ECA';
  let audience='';
  if(/\bhod\b|\bhead of (the )?dep|\bheads of dep/.test(t))audience='HODs';
  else if(/\bcoordinator/.test(t))audience='Coordinators';
  else if(/\bteacher|\bcolleague|\bfaculty\b|\bstaff\b/.test(t))audience='Teachers';
  let hat=hatFromText(t);
  const kind=kindFromText(text);
  return {grade,type,teacher,priority,due,category,audience,hat,kind,subject:'Physics'};
}

/* ===================== Capture ===================== */
function doCapture(text){
  text=(text||'').trim();if(!text)return;
  const c=classify(text);
  if(c.type==='Correction'){
    const corr={id:uid(),scope:'mine',title:text.replace(/\bby\b.*$/i,'').trim()||'Correction',grade:c.grade,teacher:'',
      copies:'',received:todayISO(),due:c.due,submitted:null,status:'pending',createdAt:Date.now()};
    state.corrections.push(corr);save();toast('Added to Exam Corrections');go('corrections');
    return;
  }
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const isLong=text.length>140||lines.length>1;
  const title=isLong?summariseTitle(lines,c):cleanTitle(text,c);
  const dup=findDupTask(title,text);
  if(dup){foldReminderInto(dup,text.slice(0,300));return;}
  const task={id:uid(),title,raw:text,kind:c.kind||'task',reminders:[],type:c.type,grade:c.grade,subject:c.subject,category:c.category,audience:c.audience,hat:c.hat,
    teacher:c.teacher,due:c.due,priority:c.priority,status:'open',recurring:null,notes:isLong?text:'',createdAt:Date.now()};
  state.tasks.push(task);save();
  toast(c.kind==='reminder'?('Reminder added'+(c.grade?' · '+c.grade:'')):`Filed under ${c.category||c.type}${c.grade?' · '+c.grade:''}${c.due?' · due '+fmtDate(c.due):''}`);
  go('tasks');
}
/* Turn a pasted email / long note into a short, readable task title. */
function titleClip(s){s=(s||'').replace(/\s+/g,' ').trim();if(s.length>90)s=s.slice(0,88).trim()+'…';return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
const TITLE_JUNK=/^(dear\b|hi\b|hello\b|greetings\b|warm regards|kind regards|best regards|regards\b|best\b|thanks\b|thank you\b|sincerely\b|cheers\b|cc\s*:|to\s*:|from\s*:|sent\s*:|date\s*:|subject\s*:)/i;
// Build a human-readable one-line title from any blob of text: drop greetings/sign-offs,
// prefer the first sentence that carries a date or an actionable keyword.
function smartTitle(text){
  const lines=(text||'').replace(/\r/g,'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const sentences=[];
  lines.forEach(l=>{if(TITLE_JUNK.test(l))return;l.split(/(?<=[.!?])\s+/).forEach(s=>{s=s.trim();if(s.length>6)sentences.push(s);});});
  if(!sentences.length){const f=lines.find(l=>!TITLE_JUNK.test(l))||lines[0]||'';return titleClip(f);}
  const key=/(meeting|ptm|revis|resched|changed|cancel|postpon|dead|due|submit|exam|moderation|report|mandator|held (from|on)|will be held|by \d|on \d|\d{1,2}\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec))/i;
  return titleClip(sentences.find(s=>key.test(s))||sentences[0]);
}
function summariseTitle(lines,c){
  const subj=lines.find(l=>/^subject\s*:/i.test(l));
  if(subj){let s=subj.replace(/^subject\s*:/i,'').replace(/^(re|fwd|fw)\s*:\s*/i,'').trim();if(s.length>6)return titleClip(s);}
  return smartTitle(lines.join('\n'));
}
function cleanTitle(text,c){
  let s=text.trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function dueClass(iso){

}
function dueLabel(iso){

  if(diff<0)return `${fmtDate(iso)} · ${-diff}d overdue`;

}

function exportICS(){
  const items=[];
  openTasks().forEach(t=>{if(t.due)items.push({t:t.title+(t.grade?' ('+t.grade+')':''),d:t.due});});
  state.ias.forEach(i=>{if(i.due&&i.stage!=='Verified')items.push({t:'IA · '+i.student+(i.topic?' — '+i.topic:''),d:i.due});});
  state.corrections.forEach(c=>{if(c.due&&!c.submitted)items.push({t:'Corrections · '+c.title,d:c.due});});
  if(!items.length){toast('No upcoming deadlines to export');return;}
  let ics='BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//ASP Console//EN\nCALSCALE:GREGORIAN\n';
  items.forEach((it,idx)=>{const nx=dOnly(it.d);nx.setDate(nx.getDate()+1);ics+='BEGIN:VEVENT\nUID:asp-'+idx+'-'+Date.now()+'@physicism\nDTSTART;VALUE=DATE:'+ymd(dOnly(it.d))+'\nDTEND;VALUE=DATE:'+ymd(nx)+'\nSUMMARY:'+it.t.replace(/[,;\n]/g,' ')+'\nEND:VEVENT\n';});
  ics+='END:VCALENDAR';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='physicism-deadlines.ics';a.click();toast('Downloaded '+items.length+' deadline'+(items.length>1?'s':''));
}

function byDue(a,b){if(!a.due)return 1;if(!b.due)return -1;return a.due<b.due?-1:1;}
function taskRow(t){
  const dc=dueClass(t.due);
  const catCls=t.category==='Exam'?'c-exam':t.category==='Student'?'c-student':t.category==='ECA'?'c-eca':'';
  let donePill='';
  if(t.status==='done'&&t.due){const d=daysBetween(t.due,t.doneAt||todayISO());donePill=d>0?`<span class="pill late">Late · ${d}d</span>`:`<span class="pill ontime">On time</span>`;}
  const rc=(t.reminders||[]).filter(r=>!r.done).length;
  const kindChip=t.kind==='reminder'?'<span class="tag rem">🔔 Reminder</span>':(t.kind==='both'?'<span class="tag rem">🔔 Task + reminder</span>':'');
  return `<div class="row ${t.status==='done'?'done':''}" data-task="${t.id}">
    <div class="check ${t.status==='done'?'done':''}" data-toggle="${t.id}">${t.status==='done'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>':''}</div>
    <span class="prio ${t.priority}"></span>
    ${t.image?`<img src="${t.image}" class="thumb" title="Attached screenshot">`:''}
    <div class="row-main">
      <p class="row-title">${esc(t.title)}</p>
      <div class="row-meta">
        ${kindChip}
        ${t.hat?`<span class="tag hatt">${esc(t.hat)}</span>`:''}
        ${t.category?`<span class="tag cat ${catCls}">${esc(t.category)}</span>`:''}
        ${t.audience?`<span class="tag aud">${esc(t.audience)}</span>`:''}
        ${t.type?`<span class="tag type">${esc(t.type)}</span>`:''}
        ${t.grade?`<span class="tag grade">${esc(t.grade)}</span>`:''}
        ${t.teacher?`<span class="tag teach">${esc(t.teacher)}</span>`:''}
        ${t.recurring?`<span class="tag subj">↻ ${t.recurring}</span>`:''}
        ${rc?`<span class="tag rem" data-reminders="${t.id}" title="View reminders">🔔 ${rc} reminder${rc>1?'s':''}</span>`:''}
      </div>
    </div>
    ${donePill}
    <span class="due ${dc}">${dueLabel(t.due)}</span>
    ${t.due?`<a class="calx" href="${gcalLink(t.title+(t.grade?' ('+t.grade+')':''),t.due)}" target="_blank" rel="noopener" title="Add to Google Calendar" onclick="event.stopPropagation()">📅</a>`:''}
    <button class="row-del" data-del="${t.id}" title="Delete"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
  </div>`;
}
function renderTasks(){
  const td=todayISO();
  let list=state.tasks.slice();
  if(taskHat!=='all')list=list.filter(t=>(t.hat||'')===taskHat);
  if(taskKind==='task')list=list.filter(t=>(t.kind||'task')==='task');
  else if(taskKind==='reminder')list=list.filter(t=>t.kind==='reminder'||t.kind==='both'||(t.reminders||[]).length);
  const f=taskFilter;
  if(f==='today')list=list.filter(t=>t.status!=='done'&&t.due===td);
  else if(f==='overdue')list=list.filter(t=>t.status!=='done'&&t.due&&daysBetween(td,t.due)<0);
  else if(f==='week')list=list.filter(t=>t.status!=='done'&&t.due&&daysBetween(td,t.due)>=0&&daysBetween(td,t.due)<=7);
  else if(f==='upcoming')list=list.filter(t=>t.status!=='done'&&(!t.due||daysBetween(td,t.due)>7));
  else if(f==='done')list=list.filter(t=>t.status==='done');
  else if(taskKind==='reminder')list=list.filter(t=>true);
  else list=list.filter(t=>t.status!=='done');
  list.sort(byDue);
  if(taskKind==='reminder'&&f!=='done')list.sort((a,b)=>(a.status==='done'?1:0)-(b.status==='done'?1:0));
  const fil=(k,l)=>`<button class="filt ${f===k?'active':''}" data-filt="${k}">${l}</button>`;
  const kindChip=(k,l)=>{const n=k==='all'?state.tasks.filter(t=>t.status!=='done').length:(k==='task'?state.tasks.filter(t=>t.status!=='done'&&(t.kind||'task')==='task').length:state.tasks.filter(t=>t.status!=='done'&&(t.kind==='reminder'||t.kind==='both'||(t.reminders||[]).length)).length);return `<button class="filt ${taskKind===k?'active':''}" data-taskkind="${k}">${l}${n?` <span style="opacity:.7">${n}</span>`:''}</button>`;};
  const hatChip=(k,l)=>{const n=state.tasks.filter(t=>t.status!=='done'&&(k==='all'||(t.hat||'')===k)).length;return `<button class="filt ${taskHat===k?'active':''}" data-taskhat="${k}">${l}${n?` <span style="opacity:.7">${n}</span>`:''}</button>`;};
  const CATS=['Exam','Student','ECA','Other','General'];
  const catOf=t=>t.category?t.category:'General';
  const grouped={};list.forEach(t=>{const k=catOf(t);(grouped[k]=grouped[k]||[]).push(t);});
  const extra=Object.keys(grouped).filter(k=>!CATS.includes(k)).sort();
  const heads=[...CATS.filter(k=>grouped[k]&&grouped[k].length).filter(k=>k!=='General'),...extra,...(grouped['General']?['General']:[])];
  const body=list.length
    ? heads.map(k=>`<div class="section"><div class="section-head"><h2>${k}${k==='General'?'':' tasks'}</h2><span class="count">${grouped[k].length}</span></div><div class="card rows">${grouped[k].map(taskRow).join('')}</div></div>`).join('')
    : `<div class="card rows">${emptyMini('No tasks for this role/filter. Capture one above.')}</div>`;
  return `${pageHead('Tasks &amp; Deadlines','Everything you owe, split by the hat you are wearing, then by type. Tick to complete; overdue items surface to the top.')}
  ${captureBox()}
  <div class="filters" style="margin-bottom:9px">
    ${hatChip('all','All roles')}${HATS.map(h=>hatChip(h,h)).join('')}
  </div>
  <div class="filters" style="margin-bottom:9px;justify-content:space-between">
    <div style="display:flex;gap:6px;flex-wrap:wrap">${kindChip('all','Everything')}${kindChip('task','Tasks')}${kindChip('reminder','Reminders')}</div>
    <button class="btn sm primary" data-newtask><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>New task / reminder</button>
  </div>
  <div class="filters">
    ${fil('all','All open')}${fil('today','Today')}${fil('overdue','Overdue')}${fil('week','This week')}${fil('upcoming','Upcoming')}${fil('done','Completed')}
  </div>
  ${body}`;
}

/* ===================== IA Lab ===================== */
const IA_STAGES=['Proposal','Data Collection','Draft','Feedback','Final','Verified'];
const IA_CHECKS=['Research question focused & includes variables','Independent & dependent variables identified','Controlled variables stated','Methodology reproducible','Raw data table with correct units','Measurement uncertainties recorded','Significant figures consistent','Graphs: correct axes, scale & error bars','Data processing / calculations shown','Uncertainty propagation attempted','Conclusion justified by the data','Evaluation with realistic improvements'];
function iaState(i){
  if(i.stage==='Verified')return {k:'ontime',label:'Verified',dot:'good'};
  if(i.due){const d=daysBetween(todayISO(),i.due);
    if(d<0)return {k:'overdue',label:`Behind · ${-d}d`,dot:'warn'};
    if(d===0)return {k:'pending',label:'Due today',dot:'warn'};
    return {k:'pending',label:`${d}d left`,dot:'mute'};}
  return {k:'pending',label:'No date',dot:'mute'};
}
function blockTeacher(code){if(!code)return '';const st=state.staff.find(s=>(s.timetable||[]).some(sl=>(sl.block||'').toLowerCase()===(''+code).toLowerCase()));return st?st.name:'';}
function filesOf(i){return (i.files&&i.files.length)?i.files:(i.fileName?[{id:'legacy',name:i.fileName,thumb:i.fileThumb||null,note:'',stage:i.stage||'',at:i.createdAt}]:[]);}
function renderIA(){
  let ias=state.ias.slice();
  if(iaStageF!=='all')ias=ias.filter(i=>(i.stage||'Proposal')===iaStageF);
  if(iaTeacherF!=='all')ias=ias.filter(i=>(i.supervisor||'')===iaTeacherF);
  if(iaBlockF!=='all')ias=ias.filter(i=>(i.block||'Unassigned')===iaBlockF);
  const groups={};
  ias.forEach(i=>{const k=i.block||'Unassigned';(groups[k]=groups[k]||[]).push(i);});
  const keys=Object.keys(groups).sort((a,b)=>a==='Unassigned'?1:(b==='Unassigned'?-1:(''+a).localeCompare(''+b,undefined,{numeric:true})));
  const done=ias.filter(i=>i.stage==='Verified').length;
  const behind=ias.filter(i=>i.stage!=='Verified'&&i.due&&daysBetween(todayISO(),i.due)<0).length;
  const blocks=Array.from(new Set(state.ias.map(i=>i.block||'Unassigned'))).sort((a,b)=>a==='Unassigned'?1:(b==='Unassigned'?-1:(''+a).localeCompare(''+b,undefined,{numeric:true})));
  const teacherNames=Array.from(new Set(state.ias.map(i=>i.supervisor).filter(Boolean))).sort();
  const SEL='padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;background:var(--surface)';
  const anyF=iaStageF!=='all'||iaTeacherF!=='all'||iaBlockF!=='all';
  const filterBar=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px">
    <select id="ia_stagef" style="${SEL}"><option value="all"${iaStageF==='all'?' selected':''}>All stages</option>${IA_STAGES.map(s=>`<option ${s===iaStageF?'selected':''}>${s}</option>`).join('')}</select>
    <select id="ia_teacherf" style="${SEL}"><option value="all">All supervisors</option>${teacherNames.map(n=>`<option ${n===iaTeacherF?'selected':''}>${esc(n)}</option>`).join('')}</select>
    <select id="ia_blockf" style="${SEL}"><option value="all">All blocks</option>${blocks.map(b=>`<option ${b===iaBlockF?'selected':''}>${b==='Unassigned'?'Unassigned':'Block '+esc(b)}</option>`).join('')}</select>
    ${anyF?'<button class="btn sm" data-iaclearf>Clear filters</button>':''}

function bandColor(b,m){const r=(+b||0)/(m||6);return r>=0.75?'var(--good)':(r>=0.5?'#b07d22':'var(--crit)');}
function statusColor(s){return s==='extending'?'var(--good)':(s==='lagging'?'var(--crit)':'var(--brand)');}
function concernColor(c){return c==='high'?'var(--crit)':(c==='medium'?'#b07d22':'var(--good)');}
async function assessIA(i){
  const files=filesOf(i)||[];
  const f=files.filter(x=>x.thumb&&/^data:(image\/|application\/pdf)/.test(x.thumb)).slice(-1)[0];
  if(!f){
    const other=files.filter(x=>x.thumb&&/^data:/.test(x.thumb)).slice(-1)[0];
    if(other){toast('AI reads PDF or image files — save “'+other.name+'” as a PDF to assess it. The file is still stored.');return;}
    toast('Attach the IA file (PDF or image) in Files below first');return;
  }
  if(!aiEnabled()){aiSettingsModal();return;}
  loadingModal('Reading & assessing the IA…');
  try{const r=await aiExtract('ia_assess',{image:f.thumb});
    if(!r||!Array.isArray(r.criteria)){closeModal();iaModal(i);toast('Could not assess — is the Worker deployed?');return;}
    i.assess=Object.assign({at:Date.now(),fileName:f.name},r);save();closeModal();iaModal(i);toast('Assessment ready');
  }catch(e){closeModal();iaModal(i);toast(e.message||'Assessment failed');}
}

      ${crit}

function teacherStats(name){
  const td=todayISO();
  const tasks=state.tasks.filter(t=>t.teacher===name);
  const open=tasks.filter(t=>t.status!=='done');
  const overdue=open.filter(t=>t.due&&daysBetween(td,t.due)<0);
  const corr=state.corrections.filter(c=>c.scope==='team'&&c.teacher===name);
  const done=corr.filter(c=>c.submitted);
  const onTime=done.filter(c=>daysBetween(c.due,c.submitted)<=0).length;
  const late=done.length-onTime;
  const pendCorr=corr.filter(c=>!c.submitted);
  const corrOverdue=pendCorr.filter(c=>c.due&&daysBetween(td,c.due)<0);
  const ia=state.ias.filter(i=>i.supervisor===name&&i.stage!=='Verified');
  return {tasks,open,overdue,corr,done,onTime,late,pendCorr,corrOverdue,ia};
}

function periodKey(p){const s=(''+p).toLowerCase();if(/mct|morning circle/.test(s))return -2;if(/assembl/.test(s))return -1;if(/clos/.test(s))return 9999;if(/break|recess|lunch|interval/.test(s))return 1000;const m=s.match(/(\d+)/);return m?+m[1]:900;}

function expandPeriods(p){
  p=(''+(p||'')).trim();

  if(m){const a=+m[1],b=+m[2];if(b>=a&&(b-a)<=8){const out=[];for(let k=a;k<=b;k++)out.push(''+k);return out;}}

function periodMinutes(p,map){

  if(k>=1&&k<=17)return 480+(k-1)*23;   // from 8:00, monotonic through to afternoon

/* ===================== AI extraction (via your Grok proxy) ===================== */
function aiUrl(){const u=(store.aiUrl||'').trim();return u||DEFAULT_AI_URL;}
function aiEnabled(){return !!aiUrl();}
async function aiExtract(mode,payload){
  const url=aiUrl();
  if(!url)throw new Error('AI backend not set up yet — add its URL under “AI auto-extract”.');
  const body={mode:mode,passcode:ACCESS_CODE};
  if(payload){if(payload.image)body.image=payload.image;if(payload.text)body.text=payload.text;}
  const attempt=()=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let res=await attempt();
  // Retry transient server errors (overloaded / bad gateway / rate limit) with backoff.
  for(let i=0;i<2&&(res.status===429||res.status===500||res.status===502||res.status===503);i++){
    await new Promise(r=>setTimeout(r,i===0?4000:9000));
    res=await attempt();
  }
  if(!res.ok){let m='AI request failed ('+res.status+').';try{const j=await res.json();if(j&&j.error)m=j.error;}catch(e){}
    if(res.status===503||/503|overloaded|unavailable|try again/i.test(m))m='Google’s AI is overloaded right now (error 503). Wait 10–20 seconds and try again — it usually clears quickly. If it keeps failing, give it a minute and retry.';
    else if(res.status===429||/429|quota|rate.?limit|exceeded/i.test(m))m='Google’s free AI limit is maxed out for the moment (rate limit). Wait about a minute and try again, and do one item at a time. Daily free limits reset after midnight US-Pacific.';
    throw new Error(m);}
  return await res.json();
}

function normGrade(g){

function normDay(d){if(!d)return '';d=(''+d).trim().toLowerCase();const map={mon:'Mon',monday:'Mon',tue:'Tue',tues:'Tue',tuesday:'Tue',wed:'Wed',weds:'Wed',wednesday:'Wed',thu:'Thu',thur:'Thu',thurs:'Thu',thursday:'Thu',fri:'Fri',friday:'Fri',sat:'Sat',saturday:'Sat',mo:'Mon',tu:'Tue',we:'Wed',th:'Thu',fr:'Fri',sa:'Sat'};if(map[d])return map[d];return map[d.slice(0,3)]||'';}
function normPeriod(p){if(!p)return '';p=(''+p).toUpperCase().replace(/\s/g,'');if(PERIODS.includes(p))return p;const m=p.match(/(\d+)/);return m&&PERIODS.includes('P'+m[1])?('P'+m[1]):'';}

function dateFromText(t){

// Detect whether pasted material is a reminder, a task, or both.
function kindFromText(t){t=' '+(''+(t||'')).toLowerCase()+' ';
  const rem=/\b(remind|reminder|heads?[- ]?up|don'?t forget|note that|fyi|please note|timetable (has )?changed|students? (have|has) to go|need(s)? (a )?substitut|cover needed|leaving early|will be away|absent today)\b/.test(t);
  const task=/\b(task|to-?do|action|prepare|submit|complete|make|create|send|finish|assign|review|mark|moderat|deadline|due)\b/.test(t);
  if(rem&&task)return 'both';if(rem)return 'reminder';return 'task';
}
// Normalise a string to compare two task titles for near-duplicates.
function dupKey(s){return (''+(s||'')).toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\b(the|a|an|for|of|to|is|are|has|have|please|kindly|regarding|re|fwd)\b/g,'').replace(/\s+/g,' ').trim();}
// Find an open task that strongly matches the pasted material, so we fold a reminder in rather than duplicate it.
function findDupTask(title,body){
  const kt=dupKey(title);if(kt.length<6)return null;
  const words=kt.split(' ').filter(w=>w.length>3);
  let best=null,bestScore=0;
  state.tasks.filter(t=>t.status!=='done').forEach(t=>{
    const kk=dupKey(t.title);if(!kk)return;
    if(kk===kt){best=t;bestScore=99;return;}
    const overlap=words.filter(w=>kk.indexOf(w)>=0).length;
    const score=words.length?overlap/words.length:0;
    if(score>=0.6&&score>bestScore){best=t;bestScore=score;}
  });
  return bestScore>=0.6?best:null;
}
// Append pasted content as a reminder on an existing task (with the user's confirmation).
function foldReminderInto(t,text){

}

/* ===================== Meetings / MOM ===================== */
const MEETING_TYPES=['Department','IB DP','HOD / Leadership','Parent','Pastoral','Other'];
// Parse numeric (12.10.2026 / 12-10-26) or worded (12 Oct) dates.
function parseAnyDate(s){
  if(!s)return null;
  const m=(''+s).match(/\b(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{2,4})\b/);
  if(m){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>=1&&mo<=12&&d>=1&&d<=31)return y+'-'+pad2(mo)+'-'+pad2(d);}
  return dateFromText(s);
}
// Turn pasted minutes into a structured meeting record. Handles table (tab/space columns)
// AND "Label: value" formats. Pure local parsing — no AI/quota needed.
function parseMOM(text){
  const raw=(text||'').replace(/\r/g,'');
  const lines=raw.split(/\n+/).map(s=>s.replace(/\s+$/,'')).filter(l=>l.trim());
  const out={title:'',date:null,type:'Department',attendees:[],agenda:'',decisions:[],actions:[],notes:raw.trim()};
  const actClip=s=>{s=(''+(s||'')).replace(/\s+/g,' ').trim();return s.length>150?s.slice(0,148).trim()+'…':s;};
  const clean=s=>(''+s).replace(/^\s*[#>]+\s*/,'').replace(/^\*+|\*+$/g,'').trim();
  const cols=l=>{if(/\|/.test(l))return l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(clean);return l.split(/\t| {2,}/).map(clean);};
  const META_LABEL=/^(date|held on|dated|meeting date|department|members present|present|attendees|participants|members|in attendance|meeting focus|focus|agenda|purpose|objective|subject|title|topic|time|venue|chair|minutes of)/i;
  const HEADKW=/^(s\.?\s*no|sr\.?\s*no|task|action|assigned|owner|responsib|evidence|status|outcome|record|requirement|area|expected|peer|self|point|particular|due|deadline|timeline|target|when)/i;
  const ownerPat=/^(mr|ms|mrs|dr|lab assistant|respective|physics dep|staff|whole|all |hod\b)/i;
  const knownOwner=c=>!!c&&(ownerPat.test(c)||state.settings.teachers.some(n=>n&&c.toLowerCase().indexOf((''+n).toLowerCase().replace(/^(mr|ms|mrs|dr)\.?\s*/i,''))>=0));
  // ---- meta ----
  const metaVal=re=>{for(const l of lines){const c=cols(l);if(c.length>=2&&re.test(c[0]))return c.slice(1).join(' ').trim();}return '';};
  const titleHead=lines.find(l=>/^[#*>\s]*(minutes of (the )?meeting|mom\b|meeting\s*(minutes|record))/i.test(l));
  out.title=titleHead?titleClip(clean(titleHead)):(titleClip(metaVal(/^(subject|title|topic)$/i))||smartTitle(raw));
  if(!out.title)out.title='Meeting — '+fmtDate(todayISO());
  out.date=parseAnyDate(metaVal(/^(date|held on|dated|meeting date)$/i))||parseAnyDate(raw)||todayISO();
  const attv=metaVal(/^(members present|present|attendees|participants|members|in attendance)$/i);
  if(attv)out.attendees=attv.split(/[,;]|\s{2,}/).map(s=>s.trim()).filter(Boolean);
  const focusv=metaVal(/^(meeting focus|focus|agenda|purpose|objective)$/i);
  if(focusv)out.agenda=focusv;
  const low=raw.toLowerCase();
  if(/\bib\b|\bdp\b|dp1|dp2|diploma/.test(low))out.type='IB DP';
  else if(/\bhod\b|head of dep|leadership|slt\b/.test(low))out.type='HOD / Leadership';
  else if(/parent|ptm/.test(low))out.type='Parent';
  else if(/pastoral|form tutor|mentor|wellbeing/.test(low))out.type='Pastoral';
  else if(/physics|department|dept|subject/.test(low))out.type='Department';
  const mkAction=(textCell,ownerCell,areaCell)=>{
    let body=(''+(textCell||'')).trim();
    let owner=(''+(ownerCell||'')).trim();
    if(!owner){const om=body.match(/\(([^)]{2,40})\)\s*$/);if(om&&!/^\d/.test(om[1].trim())){owner=om[1].trim();body=body.replace(/\s*\([^)]*\)\s*$/,'').trim();}}
    const due=parseAnyDate(textCell);
    let text=actClip(body);
    if(areaCell&&areaCell.length<42&&areaCell.toLowerCase()!==body.toLowerCase())text=actClip(areaCell+' — '+body);
    if(!text||text.length<4)return null;
    if(/^(to be updated|tbd|pending|n\/a|-|–)$/i.test(owner))owner='';
    return {text:text,owner:owner,due:due,done:false,taskId:null};
  };
  // ---- walk: tables + colon sections ----
  let colTask=-1,colAction=-1,colOwner=-1,colDue=-1,inTable=false,sec='';
  lines.forEach(l=>{
    const c=cols(l),ne=c.filter(Boolean);
    // markdown table separator row ( |---|:--:|--- ) — ignore
    if(ne.length&&ne.every(x=>/^:?-{2,}:?$/.test(x)))return;
    // section heading on its own line (A. … / Follow-up / Decisions …)
    if(ne.length===1){
      const h=ne[0];
      if(/^[A-Z]\.\s+\S/.test(h)||/^(individual responsibilities|common departmental tasks|follow[- ]?up|action items?|decisions?|agenda|discussion)\b/i.test(h)){
        inTable=false;colTask=colAction=colOwner=colDue=-1;
        sec=/decision|resolved|agreed/i.test(h)?'dec':(/agenda|discussion|focus/i.test(h)?'agenda':'act');return;
      }
    }
    // table header row
    if(c.length>=3&&c.filter(x=>x.length<36&&HEADKW.test(x)).length>=2){
      colTask=colAction=colOwner=colDue=-1;
      c.forEach((x,i)=>{
        if(/action|requirement/i.test(x)&&colAction<0)colAction=i;
        if(/assigned\s*to|^responsibility$|^responsible$|owner/i.test(x)&&colOwner<0)colOwner=i;
        if(/due|deadline|by when|target date|timeline/i.test(x)&&colDue<0)colDue=i;
        if(/task|area/i.test(x)&&colTask<0)colTask=i;
      });
      inTable=true;return;
    }
    // known meta label line — already captured
    if(ne.length>=2&&c.length<3&&META_LABEL.test(c.find(Boolean)||''))return;
    // table data row
    if(inTable&&c.length>=2){
      const tcol=colAction>=0?colAction:(colTask>=0?colTask:-1);
      let textCell=(tcol>=0&&c[tcol])?c[tcol]:(c.filter(x=>x&&!/^\d+\.?$/.test(x)&&!knownOwner(x)).sort((a,b)=>b.length-a.length)[0]||'');
      let ownerCell=colOwner>=0?(c[colOwner]||''):'';
      if(!ownerCell){const oc=c.find(knownOwner);if(oc)ownerCell=oc;}
      const areaCell=(colAction>=0&&colTask>=0&&colTask!==colAction)?(c[colTask]||''):'';
      if(textCell&&!HEADKW.test(textCell)){const a=mkAction(textCell,ownerCell,areaCell);if(a){if(colDue>=0){const d=parseAnyDate(c[colDue]);if(d)a.due=d;}out.actions.push(a);}}
      return;
    }
    // colon-format lines (Attendees: … / Decisions: … / Action items: …)
    const m=l.match(/^([A-Za-z][A-Za-z \/-]{2,28}?)\s*:\s*(.*)$/);
    if(m){const key=m[1].toLowerCase();let ns='';
      if(/attend|present|members|participant/.test(key))ns='att';
      else if(/agenda|discussion|points discussed|focus/.test(key))ns='agenda';
      else if(/decision|resolved|agreed|conclusion/.test(key))ns='dec';
      else if(/action|to-?do|follow|next step|responsib/.test(key))ns='act';
      if(ns){sec=ns;const rest=m[2].trim();if(rest){if(ns==='att')out.attendees.push(...rest.split(/[,;]/).map(s=>s.trim()).filter(Boolean));else if(ns==='agenda')out.agenda+=(out.agenda?'\n':'')+rest;else if(ns==='dec')out.decisions.push(rest);else{const a=mkAction(rest,'','');if(a)out.actions.push(a);}}return;}
      if(META_LABEL.test(m[1].trim())){sec='';return;}}
    // plain line under a running colon-section
    if(c.length<=1){const v=l.replace(/^[-*•–—\d.\)\s]+/,'').trim();if(!v)return;
      if(sec==='att')out.attendees.push(...v.split(/[,;]/).map(s=>s.trim()).filter(Boolean));
      else if(sec==='agenda')out.agenda+=(out.agenda?'\n':'')+v;
      else if(sec==='dec')out.decisions.push(v);
      else if(sec==='act'){const a=mkAction(v,'','');if(a)out.actions.push(a);}}
  });
  out.attendees=[...new Set(out.attendees)];
  return out;
}
// Re-run the parser on a meeting's saved text (e.g. one filed before the parser understood tables).
function reparseMeeting(mid){
  const m=state.meetings.find(x=>x.id===mid);if(!m||!(m.notes||'').trim()){toast('No saved minutes text to re-read');return;}
  const p=parseMOM(m.notes);const prev=m.actions||[];
  p.actions.forEach(a=>{const old=prev.find(x=>x.text===a.text);if(old){a.done=old.done;a.taskId=old.taskId;}});
  m.title=p.title||m.title;m.date=p.date||m.date;m.type=p.type;m.attendees=p.attendees;m.decisions=p.decisions;m.actions=p.actions;if(p.agenda)m.agenda=p.agenda;
  save();refreshBadges();meetingViewModal(mid);
  toast('Re-read — '+p.attendees.length+' attendee'+(p.attendees.length===1?'':'s')+', '+p.actions.length+' action item'+(p.actions.length===1?'':'s'));
}
function fileMeetingFromText(text,insHint){
  if(!(text||'').trim()){toast('Paste the minutes first');return;}

function fileMeetingFromRoute(plan){
  const p=parseMOM(plan.notes||plan.text||plan.material||'');
  if(plan.title)p.title=titleClip(''+plan.title);
  if(plan.date&&/^\d{4}-\d{2}-\d{2}$/.test(plan.date))p.date=plan.date;
  if(MEETING_TYPES.includes(plan.type))p.type=plan.type;
  if(Array.isArray(plan.attendees)&&plan.attendees.length)p.attendees=plan.attendees.map(x=>(''+x).trim()).filter(Boolean);
  if(Array.isArray(plan.decisions)&&plan.decisions.length)p.decisions=plan.decisions.map(x=>(''+x).trim()).filter(Boolean);
  if(Array.isArray(plan.actions)&&plan.actions.length)p.actions=plan.actions.map(a=>({text:titleClip(''+(a.text||a.title||a)),owner:(a.owner||'').trim(),due:(a.due&&/^\d{4}-\d{2}-\d{2}$/.test(a.due))?a.due:null,done:false,taskId:null}));
  const m={id:uid(),createdAt:Date.now(),...p};
  state.meetings.unshift(m);save();refreshBadges();go('meetings');
  toast('Meeting saved'+(m.actions.length?' · '+m.actions.length+' action item'+(m.actions.length>1?'s':''):''));
}

function meetingStats(m){const a=m.actions||[];const done=a.filter(x=>x.done).length;return {total:a.length,done:done,open:a.length-done};}
function renderMeetings(){
  const all=state.meetings||[];
  if(meetingOpenId){const m=all.find(x=>x.id===meetingOpenId);if(m)return renderMeetingPage(m);meetingOpenId=null;}
  const types=['all',...MEETING_TYPES.filter(ty=>all.some(m=>m.type===ty))];

  list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));

  const stat=`<div class="section"><div class="card" style="padding:14px 18px;display:flex;gap:26px;flex-wrap:wrap">
    <div><div style="font-size:22px;font-weight:800">${all.length}</div><div class="mini">meeting${all.length===1?'':'s'} on record</div></div>
    <div><div style="font-size:22px;font-weight:800;color:${openActions?'var(--warn)':'var(--good)'}">${openActions}</div><div class="mini">open action item${openActions===1?'':'s'}</div></div>
  </div></div>`;
  const body=list.length?list.map(meetingCard).join(''):`<div class="card rows">${emptyMini('No meetings saved yet. Paste the minutes to keep a record.')}</div>`;
  return `${pageHead('Meetings &amp; Minutes','A record of each meeting — attendees, decisions and action items. Turn any action into a tracked task in one tap.')}
  <div style="margin-bottom:12px;display:flex;gap:9px;flex-wrap:wrap">
    <button class="btn primary" data-newmeet><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Save a meeting (paste MOM)</button>
  </div>

}
function meetingCard(m){

        </div>

      </div>

function meetingViewModal(mid){meetingOpenId=mid;render();}
function renderMeetingPage(m){
  const att=(m.attendees||[]);
  const acts=m.actions||[];
  const s=meetingStats(m);
  const overdue=acts.filter(a=>!a.done&&a.due&&daysBetween(todayISO(),a.due)<0).length;
  const linkedN=acts.filter(a=>a.taskId&&state.tasks.some(t=>t.id===a.taskId)).length;
  const pct=s.total?Math.round(s.done/s.total*100):0;
  const donePct=s.total?s.done/s.total*100:0, openPct=s.total?s.open/s.total*100:0;
  const owners={};acts.forEach(a=>{const o=(a.owner||'').trim()||'Unassigned';owners[o]=owners[o]||{t:0,open:0};owners[o].t++;if(!a.done)owners[o].open++;});

  </div>
  ${acts.length?`<div class="section"><div class="section-head"><h2>Action tracking</h2><span class="count">${pct}% complete</span></div>

      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px">
        ${tile(s.total,'actions')}${tile(s.done,'done','var(--good)')}${tile(s.open,'open','var(--warn)')}${tile(overdue,'overdue',overdue?'var(--crit)':'var(--ink-mute)')}${tile(linkedN,'pushed to Tasks','var(--info)')}

    </div></div>`:''}
  ${ownerRows.length&&!(ownerRows.length===1&&ownerRows[0][0]==='Unassigned')?`<div class="section"><div class="section-head"><h2>By owner</h2></div><div class="card" style="padding:15px 18px">
    ${ownerRows.map(([o,v])=>`<div style="display:flex;align-items:center;gap:11px;margin-bottom:9px">

      <div style="flex:1;background:var(--surface-2);border-radius:20px;height:11px;overflow:hidden"><i style="display:block;height:100%;width:${(v.t/maxOwner*100).toFixed(0)}%;background:${v.open?'var(--warn)':'var(--good)'};border-radius:20px"></i></div>
      <div style="width:84px;text-align:right;font-size:12.5px;font-weight:700">${v.open} open / ${v.t}</div></div>`).join('')}

  <div class="section"><div class="section-head"><h2>Action items</h2><span class="count">${s.open} open</span></div>

function meetingModal(m){

  `);

    $('#mm_title').value=p.title||'';$('#mm_date').value=p.date||todayISO();$('#mm_type').value=p.type;
    $('#mm_att').value=(p.attendees||[]).join(', ');$('#mm_dec').value=(p.decisions||[]).join('\n');
    $('#mm_act').value=(p.actions||[]).map(a=>a.text+(a.owner?' ('+a.owner+')':'')+(a.due?' by '+fmtDate(a.due):'')).join('\n');
    $('#mm_notes').value=p.notes||txt;toast('Filled in — check and tweak, then Save');};
  $('#mm_save').onclick=()=>{
    const title=$('#mm_title').value.trim();if(!title){toast('Give the meeting a title');return;}

    const decs=$('#mm_dec').value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    const actLines=$('#mm_act').value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    const prev=m.actions||[];
    const acts=actLines.map((l,i)=>{let owner='',due=dateFromText(l);const om=l.match(/\(([^)]+)\)/);if(om)owner=om[1].trim();
      const text=titleClip(l.replace(/\([^)]*\)/,'').replace(/\bby\s+\d.*$/i,'').trim())||l;
      const old=prev[i];return {text:text,owner:owner,due:due,done:old?old.done:false,taskId:old?old.taskId:null};});
    const data={title:title,date:$('#mm_date').value||todayISO(),type:$('#mm_type').value,attendees:atts,decisions:decs,actions:acts,notes:$('#mm_notes').value.trim(),agenda:m.agenda||''};

    save();refreshBadges();closeModal();render();toast(edit?'Meeting updated':'Meeting saved');
  };
}

function parseStudents(text){
  const lines=(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out=[];
  const monthRe=/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i;
  for(const raw of lines){
    if(monthRe.test(raw))continue;                 // "July 18, 2025 …" activity/date line
    if(/^\d/.test(raw)&&/\b(19|20)\d{2}\b/.test(raw))continue; // bare date line
    if(/^(name|student|s\.?no\.?|roll|total|showing)\b/i.test(raw))continue;
    if(raw.includes(':'))continue;                 // label lines e.g. "Homeroom: Present"
    if(/\b(homeroom|attendance|present|absent|tardy|excused|unexcused)\b/i.test(raw))continue;
    if(/^show\b/i.test(raw))continue;              // "Show Attendance"
    let id='',work=raw;
    const paren=work.match(/\(([^)]*)\)/);
    if(paren){const m=paren[1].trim().match(/[A-Za-z0-9]+/);id=m?m[0]:'';work=work.replace(/\([^)]*\)/,'').trim();}
    if(/\t|;|\|/.test(work)){const cols=work.split(/\t|;|\|/).map(c=>c.trim()).filter(Boolean);let nm=cols[0]||'';const cm=nm.match(/^([^,]+),\s*(.+)$/);if(cm)nm=(cm[2]+' '+cm[1]).replace(/\s+/g,' ').trim();if(nm&&/[A-Za-z]/.test(nm))out.push({name:nm,id:id,topic:cols[1]||'',supervisor:cols[2]||'',grade:cols[3]||''});continue;}
    const cm=work.match(/^([^,]+),\s*([^,]+)$/);
    if(cm){const name=(cm[2].trim()+' '+cm[1].trim()).replace(/\s+/g,' ').trim();if(/[A-Za-z]/.test(name))out.push({name:name,id:id,topic:'',supervisor:'',grade:''});continue;}
    if(work.includes(',')){const cols=work.split(',').map(c=>c.trim());if(cols[0]&&/[A-Za-z]/.test(cols[0]))out.push({name:cols[0],id:id,topic:cols[1]||'',supervisor:cols[2]||'',grade:cols[3]||''});continue;}
    if(/[A-Za-z]/.test(work))out.push({name:work,id:id,topic:'',supervisor:'',grade:''});
  }
  return out;
}

let scImage=null,scFileName='';
function readImageScaled(file,cb){
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=1600;let w=img.width,h=img.height;
      if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
      try{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.82));}
      catch(e){cb(ev.target.result);}
    };
    img.onerror=()=>cb(ev.target.result);
    img.src=ev.target.result;
  };
  r.onerror=()=>cb(null);
  r.readAsDataURL(file);
}
function readFileData(file,cb){const r=new FileReader();r.onload=ev=>cb(ev.target.result);r.onerror=()=>cb(null);r.readAsDataURL(file);}

async function runRouteWith(mat,ins,image,fileName,answer){
  if(!aiEnabled()){closeModal();aiSettingsModal();return;}
  if(!mat&&!image&&!fileName&&!ins){toast('Add some material or an instruction');return;}
  const text=`TODAY: ${todayISO()} (interpret any partial or relative date, e.g. "17 Oct", as the NEXT upcoming date from today — never a past date).\n\nMATERIAL:\n${mat||('(attached file: '+(fileName||'none')+')')}\n\nINSTRUCTION: ${ins||'(none given)'}${answer?'\n\nUSER PICKED: '+answer:''}\n\nCONTEXT: ${routeContext()}`;
  const wantsStudents=/\b(student list|students?|roster|class list|manage ?bac)\b/i.test(ins||'');
  if(wantsStudents&&mat&&!image){
    const parsed=parseStudents(mat);
    if(parsed.length){closeModal();addStudentsToBlock({students:parsed},{ins,mat});return;}
  }
  const wantsMeeting=/\b(mom|minutes|meeting notes|meeting record|dept(?:artment)? meeting|save (?:this|the)? ?meeting|minutes of (?:the )?meeting)\b/i.test(ins||'')||/\bminutes of (?:the )?meeting\b/i.test(mat||'');
  if(wantsMeeting&&mat&&!image){closeModal();fileMeetingFromText(mat,ins);return;}
  const wantsOutline=/course\s*outline|scheme of work|syllabus|outline\s*(sheet|format|tracker|table)?|coverage sheet/i.test(ins||'');
  if(wantsOutline){
    loadingModal('Reading your course outline…');
    try{const r=await aiExtract('outline',{text,image:image||undefined});closeModal();
      if(r&&(Array.isArray(r.outlines)||Array.isArray(r.grades)||Array.isArray(r.rows)||Array.isArray(r.topics)||r.grade)){fileOutlineFromRoute(r);return;}
      toast('I could not read any topics from that — is the Worker deployed?');smartCaptureModal({mat,ins,image,fileName});return;
    }catch(e){closeModal();toast(e.message||'Could not read the outline');smartCaptureModal({mat,ins,image,fileName});return;}
  }
  const wantsTimetable=/time\s*table|teaching schedule|weekly schedule|class schedule/i.test(ins||'');
  if(wantsTimetable){
    loadingModal('Reading the timetable…');
    try{const r=await aiExtract('timetable',{text,image:image||undefined});closeModal();
      if(sanitizeTeacher(r).timetable.length){fileTimetableFromRoute(r);return;}
      toast('I could not read the timetable — is the Worker deployed?');smartCaptureModal({mat,ins,image,fileName});return;
    }catch(e){closeModal();toast(e.message||'Could not read the timetable');smartCaptureModal({mat,ins,image,fileName});return;}
  }
  loadingModal('Working out where this goes…');
  try{const plan=await aiExtract('route',{text,image:image||undefined});closeModal();dispatchRoute(plan,{mat,ins,image,fileName});}
  catch(e){closeModal();
    const taskish=/\btask\b|to-?do|add this|remind|follow[- ]?up/i.test(ins||'');
    if(taskish&&(mat||'').trim()){localTaskFromText(mat,ins);toast('AI was busy (rate limit) — added a task from your text. Edit the wording if needed.');return;}
    toast(e.message||'Could not process that');smartCaptureModal({mat,ins,image,fileName});
  }
}
function dispatchRoute(plan,ctx){
  if(!plan||!plan.action){toast('Could not understand that — try rephrasing step 2');smartCaptureModal(ctx);return;}
  if(plan.action==='clarify'){clarifyModal(plan,ctx);return;}
  if(plan.action==='tasks'){const fh=hatFromText((ctx&&ctx.ins)||'')||hatFromText((ctx&&ctx.mat)||'');(plan.tasks||[]).forEach(t=>{if(!t.hat&&fh)t.hat=fh;});createTasksFromAI(plan.tasks||[]);return;}
  if(plan.action==='students'){addStudentsToBlock(plan,ctx);return;}
  if(plan.action==='ia_file'){fileIaFromRoute(plan,ctx);return;}
  if(plan.action==='course_outline'||plan.action==='outline'){fileOutlineFromRoute(plan);return;}
  if(plan.action==='timetable'){fileTimetableFromRoute(plan);return;}
  if(plan.action==='meeting'||plan.action==='mom'||plan.action==='minutes'){fileMeetingFromRoute(plan);return;}
  toast('Nothing to file from that');smartCaptureModal(ctx);
}

function iaReviewModal(id){
  const i=state.ias.find(x=>x.id===id);if(!i)return;i.review=i.review||{};
  const checks=IA_CHECKS.map((c,idx)=>`<label style="display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px">
    <input type="checkbox" data-chk="${idx}" ${i.review[idx]?'checked':''} style="margin-top:3px;width:16px;height:16px;accent-color:var(--good)"><span>${c}</span></label>`).join('');
  modal(`
    <div class="modal-head"><h3>Review · ${esc(i.student)}</h3><button class="x" data-close>×</button></div>
    <div class="modal-body">
      <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px">

        ${i.fileName?`<div style="margin-top:7px"><span class="tag subj">📎 ${esc(i.fileName)}</span></div>`:''}
      </div>
      <div>
        <div style="font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px">Physics IA checklist</div>
        ${checks}
      </div>
      <div class="fld"><label>Teacher feedback / notes</label><textarea id="i_notes" rows="3" placeholder="Your comments for the student">${esc(i.notes||'')}</textarea></div>
      <button class="btn" id="i_ai" style="justify-content:center"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>Run AI review</button>
      <div id="i_aibox" style="display:none;background:var(--info-soft);border:1px solid #cfe0f3;border-radius:10px;padding:12px 13px;font-size:13px;color:var(--info);line-height:1.6"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Close</button><button class="btn primary" id="i_rsave">Save review</button></div>`);
  const persist=()=>{document.querySelectorAll('[data-chk]').forEach(c=>i.review[c.dataset.chk]=c.checked);i.notes=$('#i_notes').value;};
  $('#i_rsave').onclick=()=>{persist();i.aiChecked=Object.values(i.review).some(Boolean)||i.aiChecked;save();closeModal();render();toast('Review saved');};
  $('#i_ai').onclick=()=>{persist();const box=$('#i_aibox');box.style.display='block';box.innerHTML=aiReview(i);i.aiChecked=true;save();};
}
/* Offline physics-review summary generated from the checklist + record */
function aiReview(i){
  const missing=IA_CHECKS.filter((c,idx)=>!i.review[idx]);
  const doneN=IA_CHECKS.length-missing.length;
  const pct=Math.round(doneN/IA_CHECKS.length*100);
  const flags=[];
  if(!i.rq||i.rq.length<15)flags.push('Research question looks thin — check it names both variables and is measurable.');
  if(!i.fileName)flags.push('No IA file attached yet — upload it so the full text can be checked.');
  const priority=missing.slice(0,4).map(m=>`<li>${m}</li>`).join('')||'<li>All checklist items satisfied.</li>';
  return `<b>Physics IA review — ${pct}% of checklist met (${doneN}/${IA_CHECKS.length}).</b><br>
  ${flags.length?('<div style="margin-top:6px">⚠ '+flags.join('<br>⚠ ')+'</div>'):''}
  <div style="margin-top:8px;font-weight:700">Needs the student's attention:</div>
  <ul style="margin:4px 0 0 18px;padding:0">${priority}</ul>
  <div style="margin-top:8px;color:var(--ink-soft)">Integrity &amp; full-text analysis (similarity + AI-generated likelihood) runs on the attached file; this offline summary is built from your checklist so you can act on it immediately.</div>`;
}

function exportData(){
  save();
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`asp-coordinator-backup-${todayISO()}.json`;a.click();toast('Backup downloaded (all years)');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
      if(d&&d.years&&d.activeYear){Object.values(d.years).forEach(normYear);store=d;store.view=store.view||'dashboard';}
      else if(d&&d.tasks){const y=d.view&&store.activeYear||curAcademicYear();const yr=normYear({tasks:d.tasks,corrections:d.corrections,docs:d.docs,ias:d.ias,staff:d.staff,settings:d.settings});store.years[curAcademicYear()]=yr;store.activeYear=curAcademicYear();}
      else throw 0;
      state=store.years[store.activeYear];view=store.view||'dashboard';save();render();highlightNav();populateYears();toast('Backup restored');}catch(x){toast('That file could not be read');}};
    r.readAsText(f);};
  inp.click();
}

/* ===================== Passcode gate (wired before boot so it always works) ===================== */
function unlockGate(){
  const g=document.getElementById('gate'),pin=document.getElementById('gatePin'),err=document.getElementById('gateErr');
  const v=((pin&&pin.value)||'').trim();
  if(v===ACCESS_CODE){try{sessionStorage.setItem('asp_unlocked','1');}catch(e){}if(g)g.classList.add('hidden');}
  else{if(err)err.style.display='block';if(pin){pin.value='';pin.focus();}}
}
(function(){
  var g=document.getElementById('gate'),pin=document.getElementById('gatePin'),btn=document.getElementById('gateBtn');
  var unlocked=false;try{unlocked=sessionStorage.getItem('asp_unlocked')==='1';}catch(e){}
  if(unlocked){if(g)g.classList.add('hidden');}
  else if(pin){setTimeout(function(){pin.focus();},80);}
  if(btn)btn.onclick=unlockGate;
  if(pin)pin.addEventListener('keydown',function(e){if(e.key==='Enter')unlockGate();});
})();

/* ===================== Boot ===================== */
// One-time cleanup: give any task that was filed with a blank or greeting-only title a readable one.
function migrateTitles(){
  let changed=false;
  Object.values(store.years||{}).forEach(yr=>(yr.tasks||[]).forEach(t=>{
    const ti=(t.title||'').trim();
    if((!ti||TITLE_JUNK.test(ti))&&(t.notes||t.raw)){const nt=smartTitle(t.notes||t.raw||'');if(nt&&nt!==ti){t.title=nt;changed=true;}}
  }));
  if(changed)save();
}
try{
  migrateTitles();
  // IGCSE (Grades 9 & 10) never carry HL/SL — clear any that slipped in.
  Object.values(store.years||{}).forEach(yr=>(yr.ias||[]).forEach(i=>{if(i.hl&&!isDP(i.grade))i.hl='';}));
  // Expand any stored block-lesson period ranges ("1-2") into individual periods so blocks merge uniformly.
  Object.values(store.years||{}).forEach(yr=>(yr.staff||[]).forEach(s=>{
    if(!Array.isArray(s.timetable))return;const out=[];let touched=false;
    s.timetable.forEach(x=>{const ps=expandPeriods((''+(x.period||'')).trim());if(ps.length>1){touched=true;ps.forEach(p=>out.push(Object.assign({},x,{period:p})));}else out.push(x);});
    if(touched)s.timetable=out;
  }));
  save();
  if(store.seeded!==true){
    const empty=!state.tasks.length&&!state.corrections.length&&!state.docs.length&&!state.ias.length&&!state.staff.length;
    if(empty)seedData();
    store.seeded=true;save();
  }
  view='dashboard';store.view='dashboard';
  populateYears();highlightNav();render();
}catch(err){console.error('Boot error:',err);}
